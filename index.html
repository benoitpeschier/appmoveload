        <div class="bar-row">
          <div class="bar-label"><span>${t("Charge cardio")}</span><span>${fmtMinSec(a.hr[2])} ${t("en I3")}</span></div>
          <div class="bar">${stackBar(a.hr, ["var(--i1)","var(--i2)","var(--i3)"])}</div>
        </div>
        ${a.lastSessionIsConditioning ? `
        <p class="chart-note">${t("Séance PPG — charge cardio uniquement.")}</p>` : `
        <div class="bar-row">
          <div class="bar-label"><span>${t("Charge mécanique")}</span><span>${fmtMinSec(a.mech[2])} ${t("en zone 3")}</span></div>
          <div class="bar">${stackBar(a.mech, ["var(--z1)","var(--z2)","var(--z3)"])}</div>
        </div>`}
        ${!(a.hrv || []).length ? "" : (() => {
          const state = hrvStateAt(a, a.hrv.length - 1);
          const fresh = a.hrvToday && a.hrvToday.date === isoDate(new Date());
          const sinceLast = a.hrv.length
            ? Math.round((new Date() - new Date(a.hrv[a.hrv.length - 1].date + "T12:00:00")) / 86400000) : null;
          return `<div class="hrv-strip">
            <div class="hrv-strip-row">
              <span class="hrv-pill ${fresh ? state : "none"}">${fresh ? "\u2665" : "\u2661"} ${
                t(HRV_STATE_LABEL[fresh ? state : "none"])}</span>
              <span class="hrv-strip-spark">${hrvSparkline(a)}</span>
            </div>
            <p class="hrv-strip-foot">${a.hrvToday && a.hrvToday.wellness != null && fresh
              ? t("score Wellness") + " " + a.hrvToday.wellness + " %"
              : t("pas de test depuis") + " " + sinceLast + " j"}</p>
          </div>`;
        })()}
        <div class="card-foot">
          <div class="trend">
            ${sparkline(a.history, 64, 24)}
            <span class="trend-delta ${trend.dir}">${trend.label}</span>
          </div>
        </div>
      </article>`;
  }

  const RADAR_LABELS = {3:"3 s", 6:"6 s", 9:"9 s", 15:"15 s", 30:"30 s", 45:"45 s", 90:"90 s", 180:"3 min"};
  const GENDER_LABEL = {H: t("Homme"), F: t("Femme")};

  function peerGroup(a) {
    return athletes.filter(x => x.sessions.length > 0 && x.gender === a.gender && x.boatType === a.boatType);
  }

  const RADAR_SCALE_MIN = 50; // zoomed-in scale: center = 50%, edge = 100%, so small gaps read clearly

  /// Seconds above the athlete's anchor, as a figure and as a share of the
  /// time the zones counted — a number without a size is hard to weigh.
  function aboveHTML(a) {
    const counted = a.mech[0] + a.mech[1] + a.mech[2];
    if (!a.aboveAnchor) {
      return `<p class="chart-note">${t("Aucun temps au-dessus de la référence — ou référence 45 s pas encore confirmée pour cet athlète.")}</p>`;
    }
    const pct = counted > 0 ? Math.round(a.aboveAnchor / counted * 100) : 0;
    return `<div class="above"><b>${fmtMinSec(a.aboveAnchor)}</b><span>${pct} ${t("% du temps compté")}</span></div>
      <div class="above-bar"><i style="width:${Math.min(100, pct)}%"></i></div>`;
  }

  /// The athlete's best nine seconds, sample for sample.
  ///
  /// Every other figure here is a total or a peak; this is the only one that
  /// shows a *shape*. Each hump is one stroke, so what the coach reads is how
  /// the pull builds, where it peaks, and whether the recovery comes back to
  /// the same floor every time — none of which a number can carry.
  ///
  /// Negative values are kept and drawn below the baseline: the sensor
  /// decelerates between strokes, and clipping that away hid half of what
  /// distinguishes a clean recovery from a hurried one. Clipping it was tried
  /// on 2026-09-18 and undone the same hour — the curve was not the problem.
  ///
  /// What went, that day: the dashed zero line, and the axis label under the
  /// plot when it is negative. Both were noise around a curve that reads
  /// perfectly well without them, and a figure like "−7.4" in a corner invites
  /// a reading — worst deceleration? — that it does not carry.
  function strokeSVG(a) {
    const raw = a.strokeSignal;
    if (!Array.isArray(raw) || raw.length < 2) return "";

    // A light centred mean — five samples, under a tenth of a second against a
    // stroke of roughly seven. It takes the sensor's sample-to-sample noise off
    // without touching the shape or the height of the peak. The hover reports
    // this same smoothed value, so the curve and the number always agree.
    const K = 2;
    const signal = raw.map((_, i) => {
      let sum = 0, n = 0;
      for (let j = Math.max(0, i - K); j <= Math.min(raw.length - 1, i + K); j++) { sum += raw[j]; n++; }
      return sum / n;
    });

    const w = 560, h = 170, padL = 34, padT = 10, plotH = h - padT - 24;
    const hi = Math.max(...signal, 0.001);
    const lo = Math.min(...signal, 0);
    const span = (hi - lo) || 1;
    const rate = a.strokeRateHz > 0 ? a.strokeRateHz : signal.length / 9;
    const x = i => padL + (i / (signal.length - 1)) * (w - padL - 8);
    const y = v => padT + plotH - ((v - lo) / span) * plotH;

    const path = signal.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");

    const ticks = [];
    for (let sec = 0; sec <= 9; sec++) {
      const px = x(Math.min(signal.length - 1, Math.round(sec * rate)));
      ticks.push(`<line x1="${px.toFixed(1)}" y1="${padT}" x2="${px.toFixed(1)}" y2="${(padT + plotH).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`);
      ticks.push(`<text x="${px.toFixed(1)}" y="${h - 6}" text-anchor="middle" font-size="10" fill="var(--ink-muted)">${sec}</text>`);
    }

    // One hover target every tenth of a second: dense enough to read any part
    // of a stroke, sparse enough not to put 470 elements in the page.
    const step = Math.max(1, Math.round(rate / 10));
    const dots = [];
    for (let i = 0; i < signal.length; i += step) {
      dots.push(`<circle class="hoverpt" cx="${x(i).toFixed(1)}" cy="${y(signal[i]).toFixed(1)}" r="4" fill="transparent" data-label="${(i / rate).toFixed(2)} s" data-value="${signal[i].toFixed(2)} m/s²"/>`);
    }

    return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Accélération sur les neuf meilleures secondes")}">
      ${ticks.join("")}
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="4" y="${(padT + 9).toFixed(1)}" font-size="10" fill="var(--ink-muted)">${hi.toFixed(1)}</text>
      ${lo < 0 ? "" : `<text x="4" y="${(padT + plotH).toFixed(1)}" font-size="10" fill="var(--ink-muted)">${lo.toFixed(1)}</text>`}
      ${dots.join("")}
    </svg>`;
  }

  /// Today's reading in one line: resting rate, rMSSD, and the wellness score
  /// the athlete declared. The two are shown together because their
  /// *disagreement* is the informative part — a good measurement under a bad
  /// score, or the reverse, is what a coach wants to see.
  function hrvPillLabel(test) {
    const parts = [`${Math.round(test.supine.hr)} bpm`, `rMSSD ${Math.round(test.supine.rmssd)}`];
    if (test.wellness != null) parts.push(`${t("Questionnaire Wellness")} ${test.wellness} %`);
    if (!test.reliable) parts.push("?");
    return parts.join(" · ");
  }

  /// Fourteen mornings, one bar each, height by rMSSD against the best of the
  /// run. **A missing test is a gap, not a zero and not an interpolation** — a
  /// run of blanks says the athlete stopped testing, which is often the first
  /// sign of something and is invisible anywhere else.
  /// Fourteen mornings as one small bar each, height and colour by *state*.
  ///
  /// Height carries the state rather than a value, for the same reason as the
  /// squad grid: on a card the size of a business card the coach reads "is it
  /// drifting", not "what was the rMSSD". A morning with no test is a dot on
  /// the floor — visibly missing, never interpolated over, because a run of
  /// them is itself the signal.
  ///
  /// `linked`: each bar opens its morning in the HRV tab. Only on the athlete's
  /// page — on the overview card a click already opens that page.
  function hrvSparkline(a, linked = false) {
    const tests = a && a.hrv ? a.hrv : [];
    if (!tests.length) return "";
    const w = 220, h = 26;
    const indexByDay = new Map(tests.map((x, i) => [x.date, i]));

    const last = new Date(tests[tests.length - 1].date + "T12:00:00");
    const cells = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(last); d.setDate(d.getDate() - i);
      const index = indexByDay.get(isoDate(d));
      cells.push(index === undefined
        ? { state: "none" }
        : { state: hrvStateAt(a, index), test: tests[index] });
    }

    const rank = { alert: 6, watch: 15, ok: 22, none: 0 };
    const fill = { alert: "var(--i3)", watch: "var(--i2)", ok: "var(--z1)" };
    const bw = w / cells.length;
    const bars = cells.map(({ state, test }, i) => {
      const x = (i * bw + 1).toFixed(1);
      if (state === "none") {
        return `<circle cx="${(i * bw + bw / 2).toFixed(1)}" cy="${h - 2}" r="1.4" fill="var(--border-strong)"/>`;
      }
      const bh = rank[state];
      const bar = `<rect x="${x}" y="${(h - bh).toFixed(1)}" width="${(bw - 2).toFixed(1)}"
        height="${bh}" fill="${fill[state]}" rx="1.2"/>`;
      if (!linked) return bar;
      // The whole column answers the click, not only the bar: an alert bar is
      // six units tall, the very morning a coach most wants to open.
      const label = `${shortDate(test.date)} — ${t(HRV_STATE_LABEL[state])}`;
      return `<g class="hrv-jump" data-hrv-jump="${esc(test.id)}" role="button" tabindex="0"
          aria-label="${esc(t("Ouvrir le test du") + " " + shortDate(test.date))}">
        <title>${esc(label)}</title>
        <rect x="${(i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${h}" fill="transparent"/>${bar}</g>`;
    }).join("");
    return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Quatorze derniers tests HRV")}">${bars}</svg>`;
  }

  // ── Motifs de fatigue (Schmitt) ─────────────────────────────────────────
  //
  // The same five rules as the app, in the same cascade order — first match
  // wins, and the order encodes which reading takes precedence when two would
  // fire. Kept in step with FatiguePatterns.swift by hand; if one moves, the
  // other must.
  const HRV_DEFAULTS = {
    energyCollapseLFSupine: -45, energyCollapseHFSupine: -70,
    energyCollapseLFStanding: -40, energyCollapseHFStanding: -50,
    acuteStressLFSupine: 110,    acuteStressLFStanding: -80,
    activationBrakeHFSupine: -60, activationBrakeHFStanding: 300,
    extremeFatigueHFSupine: 300,
    peripheralRegulationLFStanding: -80,
    smallBasePower: 50,
  };

  /// Schmitt's five rules, conditions declared rather than coded.
  ///
  /// The coach screen shows each condition with the morning's value inside it,
  /// so that "why did nothing fire" is answerable. Deriving the test from the
  /// same declaration is what stops the displayed rule and the evaluated rule
  /// from drifting apart — the mockup hard-coded its display, and a hard-coded
  /// display of a threshold that is editable per athlete would start lying the
  /// first time somebody changed one.
  const HRV_PATTERNS = [
    { id: "F(HF-LF-)SU_ST", dot: "#C0392B",
      reading: t("Effondrement de l'énergie — hypotonie para et orthosympathique debout et couché, « over reaching »"),
      conds: [["hfSu", "HFsu", "<", "energyCollapseHFSupine"],
              ["lfSu", "LFsu", "<", "energyCollapseLFSupine"],
              ["hfSt", "HFst", "<", "energyCollapseHFStanding"],
              ["lfSt", "LFst", "<", "energyCollapseLFStanding"]],
      remedy: t("Fatigue importante, réduire le volume d'entraînement et conserver une polarisation importante (basse intensité inférieure à SV1 et très haute intensité : anaérobie alactique).") },
    { id: "F(LF+SU LF-ST)", dot: "#D97D0D",
      reading: t("Stress aigu — hypertonie orthosympathique couché"),
      conds: [["lfSu", "LFsu", ">", "acuteStressLFSupine"],
              ["lfSt", "LFst", "<", "acuteStressLFStanding"]],
      remedy: t("Nuit difficile, réduire le volume d'entraînement et conserver une polarisation importante (basse intensité inférieure à SV1 et très haute intensité : anaérobie alactique). Compenser les dépenses énergétiques par des apports de glucides lents réguliers. La récupération peut être réalisée en 2 à 3 jours.") },
    { id: "F(HF-SU HF+ST)", dot: "#7A5230",
      reading: t("Frein à l'activation — hypertonie parasympathique debout"),
      conds: [["hfSu", "HFsu", "<", "activationBrakeHFSupine"],
              ["hfSt", "HFst", ">", "activationBrakeHFStanding"]],
      remedy: t("Sensation d'être bridé dans l'effort et de ne pas pouvoir faire monter la FC. Diminuer le volume d'entraînement et augmenter la part de très haute intensité (anaérobie lactique et alactique). La récupération peut être rapide, 2 à 3 jours.") },
    { id: "F(HF+SU)", dot: "var(--ink)",
      reading: t("Fatigue extrême — hypertonie parasympathique couché"),
      conds: [["hfSu", "HFsu", ">", "extremeFatigueHFSupine"]],
      remedy: t("Réduire fortement le volume d'entraînement et conserver uniquement des stimulations importantes à très haute intensité entrecoupées de périodes de récupération longues (jours de repos). La récupération peut être longue (semaines) à très longue (mois).") },
    { id: "F(LF-st)", dot: "#7B4EA8",
      reading: t("Trouble de régulation de la pression périphérique — hypotonie orthosympathique debout"),
      conds: [["lfSt", "LFst", "<", "peripheralRegulationLFStanding"]],
      remedy: t("Sensation de vertiges possibles lors du test debout. La FC ne monte pas à l'effort. Réduire fortement le volume d'entraînement et conserver uniquement des stimulations à très haute intensité entrecoupées de périodes de récupération longues. La récupération peut être réalisée en 2 à 3 jours, mais sans remédiation cela peut durer quelques semaines.") },
  ];

  function condHolds([key, , op, threshold], deltas, thresholds) {
    const v = deltas[key], limit = thresholds[threshold];
    return op === "<" ? v < limit : v > limit;
  }

  // Every rule is a conjunction; the cascade takes the first whose halves all hold.
  HRV_PATTERNS.forEach(p => {
    p.test = (d, th) => p.conds.every(c => condHolds(c, d, th));
  });

  function pctChange(reference, current) {
    // A reference of zero has no percentage. A huge number here would fire the
    // +500 % rule on the first test after a failed one.
    return reference > 0 ? (current - reference) / reference * 100 : null;
  }

  function median(values) {
    const v = [...values].sort((x, y) => x - y);
    if (!v.length) return 0;
    const m = v.length >> 1;
    return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
  }

  /// The median of up to the six tests before this one, so one bad night does
  /// not redefine the baseline everything is read against.
  function hrvVerdict(a) {
    return hrvVerdictAt(a, (a.hrv || []).length - 1);
  }

  /// The verdict for one particular test, read against the six before it.
  ///
  /// Indexed rather than fixed on the latest, because the squad grid needs a
  /// state per morning: a fortnight of verdicts is what shows a drift, and one
  /// verdict for the last day shows nothing at all.
  function hrvVerdictAt(a, index) {
    const tests = a.hrv || [];
    if (index < 1 || index >= tests.length) return null;
    const current = tests[index];
    const earlier = tests.slice(Math.max(0, index - 6), index);
    if (!earlier.length) return null;

    const ref = {
      suLF: median(earlier.map(x => x.supine.lf)),   suHF: median(earlier.map(x => x.supine.hf)),
      stLF: median(earlier.map(x => x.standing.lf)), stHF: median(earlier.map(x => x.standing.hf)),
    };
    const d = {
      hfSu: pctChange(ref.suHF, current.supine.hf), lfSu: pctChange(ref.suLF, current.supine.lf),
      hfSt: pctChange(ref.stHF, current.standing.hf), lfSt: pctChange(ref.stLF, current.standing.lf),
    };
    if (Object.values(d).some(v => v === null)) return null;

    const t = Object.assign({}, HRV_DEFAULTS, a.hrvThresholds || {});
    const match = HRV_PATTERNS.find(p => p.test(d, t)) || null;
    // A small base only misleads when a big percentage comes off it. Flagging
    // every small reference instead lit the warning permanently for an athlete
    // whose standing HF simply sits around 16 ms² — a real case from the
    // workbook — and a warning that is always on is read as decoration.
    const bases = { hfSu: ref.suHF, lfSu: ref.suLF, hfSt: ref.stHF, lfSt: ref.stLF };
    const smallBase = Object.keys(d).some(
      k => bases[k] < t.smallBasePower && Math.abs(d[k]) > 100);
    return {
      pattern: match, deltas: d, bases, smallBase,
      date: current.date, reliable: current.reliable !== false,
    };
  }

  /// One of "ok" · "watch" · "alert" · "none" for a given morning.
  ///
  /// Schmitt's cascade has no severity tiers — a motif matches or it does not.
  /// "watch" is therefore not his: it is a reading the engine itself distrusts,
  /// either because the spectrum was flagged unreliable or because a delta rests
  /// on a base too small for a percentage to mean much. Worth a look before the
  /// session, not worth a conclusion — which is exactly the gap between "rien à
  /// signaler" and "motif de fatigue".
  function hrvStateAt(a, index) {
    const tests = a.hrv || [];
    if (index < 0 || index >= tests.length) return "none";
    const verdict = hrvVerdictAt(a, index);
    if (!verdict) return tests[index].reliable === false ? "watch" : "ok";
    if (verdict.pattern) return "alert";
    return (verdict.smallBase || !verdict.reliable) ? "watch" : "ok";
  }

  /// The morning reading, on the athlete's own page.
  ///
  /// It was missing entirely: HRV appeared on the overview card and in its own
  /// tab, but an athlete's detail carried the threshold editor and never the
  /// measurement those thresholds are applied to — settings with no sight of
  /// what they decide.
  function hrvDetailHTML(a) {
    const tests = a.hrv || [];
    if (!tests.length) {
      return `<p class="empty-note">${t("Aucun test HRV pour cet athlète.")}</p>`;
    }
    const last = tests[tests.length - 1];
    const verdict = hrvVerdict(a);

    const pct = v => (v == null ? "—" : (v > 0 ? "+" : "") + Math.round(v) + " %");
    const deltaCell = (label, value) => `
      <div class="hrv-delta">
        <span class="hrv-delta-label">${esc(label)}</span>
        <span class="hrv-delta-value ${value > 0 ? "pos" : value < 0 ? "neg" : ""}">${pct(value)}</span>
      </div>`;

    let verdictHTML;
    if (!verdict) {
      // Two tests are the minimum, and the reference is the median of up to
      // six before this one — so a new athlete simply waits.
      verdictHTML = `<p class="chart-note">${t("Pas encore de référence : il faut au moins un test antérieur pour calculer les écarts.")}</p>`;
    } else if (verdict.pattern) {
      verdictHTML = `<p class="hrv-verdict flagged"><strong>${esc(verdict.pattern.reading)}</strong>
        <span class="banner-code">${esc(verdict.pattern.id)}</span>
        ${verdict.smallBase ? `<span class="banner-warn">${t("base faible")}</span>` : ""}</p>`;
    } else {
      verdictHTML = `<p class="hrv-verdict"><strong>${t("Équilibre physiologique")}</strong>
        ${verdict.smallBase ? `<span class="banner-warn">${t("base faible")}</span>` : ""}</p>`;
    }

    return `
      <p class="athlete-meta">${esc(relDate(last.date))} · ${esc(hrvPillLabel(last))}${last.reliable ? "" : " · " + esc(t("spectre peu fiable"))}</p>
      ${verdictHTML}
      ${verdict ? `<div class="hrv-deltas">
        ${deltaCell("HF " + t("couché"), verdict.deltas.hfSu)}
        ${deltaCell("LF " + t("couché"), verdict.deltas.lfSu)}
        ${deltaCell("HF " + t("debout"), verdict.deltas.hfSt)}
        ${deltaCell("LF " + t("debout"), verdict.deltas.lfSt)}
      </div>` : ""}
      ${hrvSparkline(a, true)}
      <p class="chart-note">${verdict ? t("Écarts en % ") + t("contre") + " " + hrvRefLabel(a, tests.length - 1) + ". " : ""}${t("Une barre manquante est un matin sans test, jamais un zéro.")}</p>
      <p class="chart-note">${t("Clique une barre pour ouvrir ce matin dans l'onglet Suivi HRV, avec les graphiques, les cinq règles et toutes les mesures.")}</p>`;
  }

  // ── The four coach panels ────────────────────────────────────────────
  // Numbers and charts belong to the coach, who reads them with an expertise
  // the athlete's phone does not have and should not pretend to. The athlete's
  // own screen stays deliberately thin.

  // Per-athlete view choices, kept out of the data so a re-render from a
  // Firestore snapshot does not throw them away.
  const hrvSeriesChoice = new Map();
  const hrvPositionChoice = new Map();
  const hrvOpenAthletes = new Set();

  const HRV_METRICS = [
    ["FC", m => m.hr, 1], ["rMSSD", m => m.rmssd, 1],
    ["LF", m => m.lf, 0], ["HF", m => m.hf, 0], ["TP", m => m.tp, 0],
  ];

  /// Value, reference and delta for every metric of one position.
  function hrvRows(a, index, position) {
    const tests = a.hrv || [];
    const current = tests[index];
    const earlier = tests.slice(Math.max(0, index - 6), index);
    if (!current || !earlier.length) return null;
    return HRV_METRICS.map(([name, get, decimals]) => {
      const v = get(current[position]);
      const ref = median(earlier.map(x => get(x[position])));
      return { name, v, ref, decimals, delta: pctChange(ref, v), smallBase: ref < HRV_DEFAULTS.smallBasePower };
    });
  }

  /// What the morning actually did, in words, from the deltas alone.
  ///
  /// Deliberately descriptive and not interpretive. Naming a physiological
  /// picture — "parasympathetic recovery" — is a clinical reading, and the app
  /// has no business inventing one; a coach who sees "HF and rMSSD above
  /// reference, LF down, HR lower" makes that call themselves, which is the
  /// whole point of giving them the numbers.
  function hrvNarrative(rows) {
    const up = rows.filter(r => r.delta != null && r.delta >= 10).map(r => r.name);
    const down = rows.filter(r => r.delta != null && r.delta <= -10).map(r => r.name);
    const parts = [];
    if (up.length) parts.push(up.join(", ") + " " + t("au-dessus de la référence"));
    if (down.length) parts.push(down.join(", ") + " " + t("en retrait"));
    if (!parts.length) return t("Toutes les mesures dans leur zone habituelle.");
    return parts.join(" · ") + ".";
  }

  /// How the reference was actually formed, in words.
  ///
  /// It is the median of up to six earlier tests — but on the second morning
  /// of an athlete's life it is one test, and calling that "the median of the
  /// six previous" is simply false. The count is read from the data.
  function hrvRefLabel(a, index) {
    const n = Math.min(6, Math.max(0, index));
    return n <= 1 ? t("le test précédent")
                  : t("la médiane des ") + n + t(" précédents");
  }

  function hrvChip(delta, smallBase) {
    if (delta == null) return `<span class="hrv-chip flat">—</span>`;
    const cls = (smallBase && Math.abs(delta) > 100) ? "warn" : delta > 0 ? "up" : delta < 0 ? "down" : "flat";
    return `<span class="hrv-chip ${cls}">${(delta > 0 ? "+" : "") + Math.round(delta)} %</span>`;
  }

  /// 1 · Bilan — the verdict, never alone: the deltas that produced it sit
  /// under it. A coach who sees them can judge; one who sees only the
  /// conclusion has to believe it.
  function hrvBilanHTML(a, index) {
    const verdict = hrvVerdictAt(a, index);
    const supine = hrvRows(a, index, "supine");
    if (!verdict || !supine) return "";
    const standing = hrvRows(a, index, "standing");

    const head = verdict.pattern
      ? `<h4 class="hrv-head flagged">${esc(verdict.pattern.reading)}</h4>
         <p class="hrv-sub">${esc(hrvNarrative(supine))} ${esc(verdict.pattern.id)}</p>
         <p class="hrv-remedy">${esc(verdict.pattern.remedy)}</p>`
      : `<h4 class="hrv-head">${t("Équilibre physiologique")}</h4>
         <p class="hrv-sub">${esc(hrvNarrative(supine))} ${t("Aucun motif de fatigue déclenché.")}</p>
         <p class="hrv-remedy">${t("La charge d'entraînement est adaptée aux capacités de l'athlète, poursuite de l'entraînement comme planifié.")}</p>`;

    const why = [["HF " + t("couché"), "hfSu"], ["LF " + t("couché"), "lfSu"],
                 ["HF " + t("debout"), "hfSt"], ["LF " + t("debout"), "lfSt"]]
      .map(([label, key]) => `<div class="why-line"><span>${esc(label)}</span>${
        hrvChip(verdict.deltas[key], verdict.bases[key] < HRV_DEFAULTS.smallBasePower)}</div>`).join("");

    const table = pos => pos.map(r =>
      `<tr><td>${esc(r.name)}</td><td class="r">${r.v.toFixed(r.decimals).replace(".", ",")}</td>
       <td class="r">${r.ref.toFixed(r.decimals).replace(".", ",")}</td>
       <td class="r">${hrvChip(r.delta, r.smallBase)}</td></tr>`).join("");

    return `<div class="hrv-panel">
      <p class="block-t">${t("Bilan")}</p>
      <div class="hrv-verdict-box">${head}
        <div class="hrv-why"><p class="block-t">${t("Ce qui l'a déterminé")}</p>${why}</div>
      </div>
      <p class="block-t">${t("LF et HF · les deux positions")}</p>
      ${hrvBarsSVG(a, index)}
      <div class="hrv-legend">
        <span class="hrv-key"><i class="hrv-swatch" style="background:var(--i2)"></i>LF</span>
        <span class="hrv-key"><i class="hrv-swatch" style="background:var(--accent)"></i>HF</span>
        <span class="hrv-key"><i class="hrv-swatch ref"></i>${t("référence")} · ${hrvRefLabel(a, index)}</span>
      </div>
      <details class="drawer" style="margin-top:.8rem">
        <summary>${t("Toutes les mesures")} · % ${t("contre")} ${hrvRefLabel(a, index)}</summary>
        <div class="drawer-body"><table class="hrv-table">
          <thead><tr><th>${t("Mesure")}</th><th class="r">${t("Valeur")}</th><th class="r">${t("Réf.")}</th><th class="r">${t("Écart")}</th></tr></thead>
          <tbody>
            <tr class="posrow"><td colspan="4">${t("Couché")}</td></tr>${table(supine)}
            <tr class="posrow"><td colspan="4">${t("Debout")}</td></tr>${table(standing)}
          </tbody></table>
          <p class="chart-note">${t("En ambre : un écart calculé sur une base trop faible pour vouloir dire grand-chose.")}</p>
        </div>
      </details>
    </div>`;
  }

  /// 2 · Motifs — every rule with the morning's value inside its condition,
  /// each half that holds turned green. That is how "why did nothing fire"
  /// gets an answer instead of a shrug.
  function hrvMotifsHTML(a, index) {
    const verdict = hrvVerdictAt(a, index);
    if (!verdict) return "";
    const thresholds = Object.assign({}, HRV_DEFAULTS, a.hrvThresholds || {});
    const fired = verdict.pattern;

    const rules = HRV_PATTERNS.map(rule => {
      const conds = rule.conds.map(c => {
        const [key, label, op, threshold] = c;
        const holds = condHolds(c, verdict.deltas, thresholds);
        const shown = `${label} ${(verdict.deltas[key] > 0 ? "+" : "") + Math.round(verdict.deltas[key])} % ${op === "<" ? "<" : ">"} ${thresholds[threshold] > 0 ? "+" : ""}${thresholds[threshold]} %`;
        return `<span class="cond-test ${holds ? "holds" : ""}">${esc(shown)}</span>`;
      }).join(`<span class="cond-and">${t("et")}</span>`);
      return `<div class="hrv-rule ${fired === rule ? "fired" : ""}">
        <div class="hrv-rule-h"><span class="hrv-dot" style="background:${rule.dot}"></span>
          <span class="hrv-rule-n">${esc(rule.id)}</span></div>
        <div class="cond">${conds}</div>
        <p class="hrv-rule-i">${esc(rule.reading)}</p>
      </div>`;
    }).join("");

    return `<div class="hrv-panel">
      <p class="block-t">${t("Motifs")} · ${t("5 règles · cascade")}</p>
      <p class="hrv-outcome ${fired ? "flagged" : ""}">${fired
        ? esc(t("Motif déclenché : ") + fired.reading)
        : t("Équilibre physiologique — aucun motif déclenché")}</p>
      <details class="drawer" style="margin-top:.6rem">
        <summary>${t("Les 5 règles en détail")}</summary>
        <div class="drawer-body hrv-rules">${rules}</div>
      </details>
      <p class="chart-note">${t("Seuils d'après Laurent Schmitt et al., repris tels quels et modifiables par athlète dans le tiroir « Seuils de fatigue », en bas de ce panneau.")}</p>
    </div>`;
  }

  /// 3 · Radar — a shape rather than five numbers. Outward is up, inward is
  /// down, the middle ring is the reference.
  ///
  /// One position at a time, as the mockup insisted: the standing deltas run
  /// an order of magnitude larger than the lying ones, so drawing both on one
  /// scale flattens lying into the middle ring and hides exactly what it is
  /// there to show.
  function hrvRadarSVG(a, index, position) {
    const rows = hrvRows(a, index, position);
    if (!rows) return "";

    const w = 280, h = 250, cx = w / 2, cy = 122, R = 88;
    const n = rows.length;
    const angleFor = i => (Math.PI * 2 * i / n) - Math.PI / 2;
    // −100 % at the centre, 0 % on the middle ring, +100 % and beyond at the
    // rim. Clamped: a +813 % would otherwise be off the page, and the shape
    // only has to say "far out", which the rim already does.
    const radiusFor = pct => R * Math.max(0, Math.min(1, (Math.max(-100, Math.min(200, pct)) + 100) / 200));
    const point = (i, pct) => [cx + Math.cos(angleFor(i)) * radiusFor(pct),
                               cy + Math.sin(angleFor(i)) * radiusFor(pct)];

    const rings = [0.25, 0.5, 0.75, 1].map(f => {
      const pts = rows.map((_, i) => [cx + Math.cos(angleFor(i)) * R * f,
                                      cy + Math.sin(angleFor(i)) * R * f]);
      const mid = Math.abs(f - 0.5) < 0.01;
      return `<polygon points="${pts.map(pt => pt.map(v => v.toFixed(1)).join(",")).join(" ")}"
        fill="none" stroke="var(--border${mid ? "-strong" : ""})" stroke-width="1"
        ${mid ? 'stroke-dasharray="4 3"' : ""}/>`;
    }).join("");

    const axes = rows.map((_, i) => {
      const [x, y] = [cx + Math.cos(angleFor(i)) * R, cy + Math.sin(angleFor(i)) * R];
      return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    }).join("");

    const shape = rows.map((r, i) => point(i, r.delta == null ? 0 : r.delta).map(v => v.toFixed(1)).join(",")).join(" ");
    const dots = rows.map((r, i) => {
      const [x, y] = point(i, r.delta == null ? 0 : r.delta);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"><title>${
        esc(`${r.name} ${r.delta == null ? "—" : (r.delta > 0 ? "+" : "") + Math.round(r.delta) + " %"}`)}</title></circle>`;
    }).join("");

    const labels = rows.map((r, i) => {
      const [x, y] = [cx + Math.cos(angleFor(i)) * (R + 20), cy + Math.sin(angleFor(i)) * (R + 16)];
      return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle"
        font-size="11" fill="var(--ink-soft)">${esc(r.name)}</text>`;
    }).join("");

    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Radar des écarts en pourcentage")}">
      ${rings}${axes}
      <polygon points="${shape}" fill="var(--accent-soft)" fill-opacity=".75" stroke="var(--accent)" stroke-width="2"/>
      ${dots}${labels}</svg>`;
  }

  function hrvRadarPanelHTML(a, index) {
    const position = hrvPositionChoice.get(a.id) || "supine";
    const svg = hrvRadarSVG(a, index, position);
    if (!svg) return "";
    const tab = (key, label) =>
      `<button class="hrv-seg-btn ${key === position ? "active" : ""}" data-hrv-position="${key}" data-athlete="${esc(a.id)}">${esc(label)}</button>`;
    return `<div class="hrv-panel">
      <p class="block-t">${t("Radar")} · ${t("écart en %")}</p>
      <div class="hrv-seg">${tab("supine", t("Couché"))}${tab("standing", t("Debout"))}</div>
      ${svg}
      <p class="chart-note">${t("Vers l'extérieur c'est en hausse, vers le centre en baisse ; l'anneau en pointillés est la référence. Une position à la fois : les écarts debout sont d'un autre ordre de grandeur et écraseraient le couché.")}</p>
    </div>`;
  }

  /// 4 · Suivi — one measure across the tests, against the athlete's own usual
  /// zone, with the declared feeling beside it.
  ///
  /// The band is this athlete's habit, never a population norm. And the
  /// wellness score sits next to the reading because it is their *disagreement*
  /// that informs: a good measurement under a bad feeling, or the reverse, is
  /// the morning worth a conversation.
  const HRV_SERIES = [
    ["tpSupine", "TP " + t("couché"), x => x.supine.tp],
    ["hrSupine", "FC " + t("couché"), x => x.supine.hr],
    ["rmssd", "rMSSD", x => x.supine.rmssd],
    ["lfStanding", "LF " + t("debout"), x => x.standing.lf],
  ];

  // ── Heart rate over the ten minutes ───────────────────────────────────
  //
  // The orthostatic response is a *shape*: two mean values say the rate rose,
  // and nothing about whether it rose at once and settled, drifted upward for
  // five minutes, or never came back down. That is the reading a coach can
  // make and no summary can carry, which is why the beats are synced at all.
  //
  // Zoom is a drag across the plot, reset is a double-click or the button:
  // ten minutes at one beat a second is six hundred points on 280 units of
  // width, so the interesting second is two pixels wide until you can open it.
  const hrvZoom = new Map();   // athlete id -> [t0, t1] in seconds
  // Screen geometry of the last render, so the pointer handlers do not have to
  // recompute — and cannot disagree with what was drawn. Filled by
  // hrvRateHTML, read by wireRateChart immediately afterwards.
  const hrvRateGeom = new Map();

  const hrMMSS = sec => Math.floor(sec / 60) + ":" + String(Math.round(sec % 60)).padStart(2, "0");

  /// Beats to points: cumulative time in seconds, instantaneous rate in bpm.
  function hrvBeatPoints(test) {
    if (!test || !test.supineRR) return null;
    const pts = [];
    let t = 0;
    const push = (arr, standing) => {
      (arr || []).forEach(rr => {
        if (!rr || rr < 250 || rr > 2500) { t += (rr || 0) / 1000; return; }
        t += rr / 1000;
        pts.push({ t, hr: 60000 / rr, standing });
      });
    };
    push(test.supineRR, false);
    const change = t;
    push(test.standingRR, true);
    return pts.length >= 2 ? { pts, change, end: t } : null;
  }

  function hrvRateHTML(a, test) {
    const data = hrvBeatPoints(test);
    if (!data) {
      return `<div class="hrv-panel">
        <p class="block-t">${t("Fréquence cardiaque")} · ${t("le test entier")}</p>
        <p class="chart-note">${t("Ce test a été synchronisé avant que l'app n'envoie les battements. La courbe apparaîtra pour les tests suivants — ou après un « Synchroniser maintenant » depuis les réglages de l'athlète.")}</p>
      </div>`;
    }

    const zoom = hrvZoom.get(a.id);
    const t0 = zoom ? zoom[0] : 0;
    const t1 = zoom ? zoom[1] : data.end;
    const shown = data.pts.filter(p => p.t >= t0 && p.t <= t1);
    if (shown.length < 2) { hrvZoom.delete(a.id); return hrvRateHTML(a, test); }

    const w = 280, h = 150, padL = 30, padR = 8, padT = 10, padB = 20;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const rates = shown.map(p => p.hr);
    const lo = Math.min(...rates), hi = Math.max(...rates);
    const yLo = Math.floor((lo - 3) / 5) * 5, yHi = Math.ceil((hi + 3) / 5) * 5;
    const xFor = tt => padL + ((tt - t0) / ((t1 - t0) || 1)) * plotW;
    const yFor = v => padT + plotH - ((v - yLo) / ((yHi - yLo) || 1)) * plotH;

    // Two paths rather than one: the change of position is a discontinuity,
    // and a line drawn across it invents a transition that was a person
    // standing up.
    const segment = standing => {
      const part = shown.filter(p => p.standing === standing);
      if (part.length < 2) return "";
      const d = part.map((p, i) => (i ? "L" : "M") + xFor(p.t).toFixed(1) + " " + yFor(p.hr).toFixed(1)).join(" ");
      return `<path d="${d}" fill="none" stroke="${standing ? "var(--z3)" : "var(--accent)"}"
        stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>`;
    };

    const marker = (data.change > t0 && data.change < t1)
      ? `<line x1="${xFor(data.change).toFixed(1)}" y1="${padT}" x2="${xFor(data.change).toFixed(1)}" y2="${padT + plotH}"
           stroke="var(--ink-muted)" stroke-width="1" stroke-dasharray="3 3"/>
         <text x="${(xFor(data.change) + 3).toFixed(1)}" y="${padT + 9}" font-size="9" fill="var(--ink-muted)">${t("debout")}</text>`
      : "";

    const ticks = [yLo, Math.round((yLo + yHi) / 2), yHi].map(v =>
      `<line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w - padR}" y2="${yFor(v).toFixed(1)}"
             stroke="var(--border)" stroke-width="1"/>
       <text x="${padL - 4}" y="${(yFor(v) + 3).toFixed(1)}" text-anchor="end" font-size="9"
             fill="var(--ink-muted)">${v}</text>`).join("");

    // Anchored inward at the ends: a centred label on the last tick hangs off
    // the viewBox and comes back clipped mid-digit.
    const xLabels = [[t0, "start"], [(t0 + t1) / 2, "middle"], [t1, "end"]].map(([tt, anchor]) =>
      `<text x="${xFor(tt).toFixed(1)}" y="${h - 6}" text-anchor="${anchor}" font-size="9"
             fill="var(--ink-muted)">${hrMMSS(tt)}</text>`).join("");

    hrvRateGeom.set(a.id, { shown, xFor, yFor, t0, t1, w, padL, plotW, padT, plotH });

    return `<div class="hrv-panel">
      <p class="block-t">${t("Fréquence cardiaque")} · ${t("le test entier")}</p>
      <div class="hr-chart" data-hr-athlete="${esc(a.id)}"
           data-hr-t0="${t0}" data-hr-t1="${t1}"
           data-hr-padl="${padL}" data-hr-padr="${padR}" data-hr-w="${w}">
        <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t("Fréquence cardiaque pendant le test"))}">
          ${ticks}${xLabels}${marker}${segment(false)}${segment(true)}
          <line class="hr-cursor" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}"
                stroke="var(--accent)" stroke-width="1" opacity="0"/>
          <circle class="hr-dot" r="2.8" fill="var(--accent)" opacity="0"/>
          <rect class="hr-brush" y="${padT}" height="${plotH}" width="0" x="0"
                fill="var(--accent-soft)" opacity="0"/>
          <rect class="hr-hit" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>
        </svg>
        <p class="hr-readout chart-note">${t("Survole la courbe pour lire une valeur ; glisse pour zoomer.")}</p>
      </div>
      <div class="hrv-legend">
        <span class="hrv-key"><i class="hrv-swatch" style="background:var(--accent)"></i>${t("couché")}</span>
        ${/* Not on a test that never got there: a key for a colour the chart
              does not contain reads as a trace one has failed to find. Judged
              on the whole test rather than the zoomed window, so it does not
              flicker as the coach zooms past the change of position. */
          data.pts.some(p => p.standing)
            ? `<span class="hrv-key"><i class="hrv-swatch" style="background:var(--z3)"></i>${t("debout")}</span>`
            : ""}
        ${zoom ? `<button class="link-btn hr-reset" data-hr-reset="${esc(a.id)}">${t("vue entière")}</button>` : ""}
      </div>
    </div>`;
  }

  /// What is left of a morning that failed.
  ///
  /// No reading — the method is the *change* from lying to standing, so one
  /// position is not a weaker verdict, it is none. But the position that did
  /// work has its figures, and they are worth seeing: a resting heart rate and
  /// an rMSSD are still an athlete's morning, and the curve beside this one is
  /// the whole record of how the measurement stopped.
  function hrvPartialHTML(test) {
    const secs = arr => (arr || []).reduce((n, v) => n + v, 0) / 1000;
    const span = s => s < 1 ? t("rien") : Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
    const num = (v, digits) => v.toLocaleString(LOCALE, { minimumFractionDigits: digits, maximumFractionDigits: digits });
    const line = (label, value) => `<div class="why-line"><span>${label}</span><span>${value}</span></div>`;
    const block = (name, m) => `<p class="block-t">${name}</p>` + (m.hr > 0
      ? line(t("FC moyenne"), num(m.hr, 0) + " bpm")
        + line("rMSSD", num(m.rmssd, 0) + " ms")
        + line(t("Puissance totale"), num(m.tp, 0) + " ms²")
        + line("LF / HF", num(m.lfhf, 2))
        + line("LF · HF", num(m.lf, 0) + " · " + num(m.hf, 0) + " ms²")
      : `<p class="chart-note">${t("Pas de données exploitables pour cette position.")}</p>`);

    return `<div class="hrv-panel">
      <p class="block-t">${t("Test incomplet")}</p>
      <p class="chart-note">${t("Capté")}${t(" : ")}${t("couché")} ${span(secs(test.supineRR))} · ${t("debout")} ${span(secs(test.standingRR))}.
        ${t("Sans les deux positions il n'y a ni écart ni motif : la méthode lit le changement de l'une à l'autre, pas chacune prise seule.")}</p>
      ${block(t("Couché"), test.supine)}
      ${block(t("Debout"), test.standing)}
    </div>`;
  }

  /// Hover to read a beat, drag across the plot to zoom, double-click to come
  /// back out.
  ///
  /// The pointer is captured on press so a drag that leaves the plot — which
  /// is most of them, the plot being 130 units tall — still ends where the
  /// finger lifts rather than staying stuck open.
  function wireRateChart(el) {
    const geom = hrvRateGeom.get(el.dataset.hrAthlete);
    if (!geom || !geom.shown.length) return;

    const svg = el.querySelector("svg");
    const cursor = el.querySelector(".hr-cursor");
    const dot = el.querySelector(".hr-dot");
    const brush = el.querySelector(".hr-brush");
    const readout = el.querySelector(".hr-readout");
    const hit = el.querySelector(".hr-hit");
    const resting = readout.textContent;
    let dragFrom = null;

    const clampX = x => Math.max(geom.padL, Math.min(geom.padL + geom.plotW, x));
    const svgX = clientX => {
      const box = svg.getBoundingClientRect();
      return box.width ? (clientX - box.left) / box.width * geom.w : geom.padL;
    };
    const timeAt = x => geom.t0 + ((x - geom.padL) / geom.plotW) * (geom.t1 - geom.t0);

    const nearest = tt => {
      let best = geom.shown[0], bestGap = Infinity;
      for (const p of geom.shown) {
        const gap = Math.abs(p.t - tt);
        if (gap < bestGap) { best = p; bestGap = gap; }
        else if (p.t > tt) break;   // sorted by time: once past, it only grows
      }
      return best;
    };

    const clear = () => {
      cursor.setAttribute("opacity", "0");
      dot.setAttribute("opacity", "0");
      readout.textContent = resting;
    };

    hit.addEventListener("pointermove", e => {
      const x = clampX(svgX(e.clientX));
      const p = nearest(timeAt(x));
      cursor.setAttribute("x1", x.toFixed(1));
      cursor.setAttribute("x2", x.toFixed(1));
      cursor.setAttribute("opacity", "1");
      dot.setAttribute("cx", geom.xFor(p.t).toFixed(1));
      dot.setAttribute("cy", geom.yFor(p.hr).toFixed(1));
      dot.setAttribute("opacity", "1");
      readout.textContent = `${hrMMSS(p.t)} · ${Math.round(p.hr)} bpm · ${p.standing ? t("debout") : t("couché")}`;
      if (dragFrom !== null) {
        brush.setAttribute("x", Math.min(dragFrom, x).toFixed(1));
        brush.setAttribute("width", Math.abs(x - dragFrom).toFixed(1));
        brush.setAttribute("opacity", "1");
      }
    });

    hit.addEventListener("pointerleave", () => { if (dragFrom === null) clear(); });

    hit.addEventListener("pointerdown", e => {
      dragFrom = clampX(svgX(e.clientX));
      hit.setPointerCapture(e.pointerId);
    });

    const endDrag = e => {
      if (dragFrom === null) return;
      const to = clampX(svgX(e.clientX));
      const from = dragFrom;
      dragFrom = null;
      brush.setAttribute("opacity", "0");
      brush.setAttribute("width", "0");
      // A click is a drag of nothing. Below a couple of seconds the zoom would
      // land on a handful of beats and read as a bug rather than as a choice.
      const a = timeAt(Math.min(from, to)), b = timeAt(Math.max(from, to));
      if (b - a < 2) return;
      hrvZoom.set(el.dataset.hrAthlete, [a, b]);
      renderHrvGrid();
    };
    hit.addEventListener("pointerup", endDrag);
    hit.addEventListener("pointercancel", () => { dragFrom = null; brush.setAttribute("opacity", "0"); });

    el.addEventListener("dblclick", () => {
      hrvZoom.delete(el.dataset.hrAthlete);
      renderHrvGrid();
    });
  }

  /// What the coach writes for the athlete, on the test it is about.
  ///
  /// It lands at the bottom of that test's page in the athlete's app. One
  /// document per athlete with a field per test — the phone only reads it, so
  /// there is a single owner and nothing to merge.
  function hrvRemarksHTML(a, test) {
    if (!test) return "";
    const existing = (a.coachNotes || {})[test.id] || "";
    return `<div class="hrv-panel">
      <p class="block-t">${t("Remarques")}</p>
      <p class="chart-note" style="margin:0 0 .6rem">${t("Test du")} ${esc(shortDate(test.date))} — ${t("visible par l'athlète dans son app, au bas de la page de ce test.")}</p>
      <textarea class="note-input" rows="4" data-note-athlete="${esc(a.id)}" data-note-test="${esc(test.id)}"
        placeholder="${esc(t("Ce que tu veux qu'il ou elle en retienne."))}">${esc(existing)}</textarea>
      <div class="note-actions">
        <button class="nav-btn note-save" style="width:auto">${t("Enregistrer")}</button>
        <span class="note-status chart-note"></span>
      </div>
    </div>`;
  }

  function hrvSuiviHTML(a, index) {
    const chosen = hrvSeriesChoice.get(a.id) || HRV_SERIES[0][0];
    const series = HRV_SERIES.find(x => x[0] === chosen) || HRV_SERIES[0];
    const tabs = HRV_SERIES.map(([key, label]) =>
      `<button class="hrv-seg-btn ${key === chosen ? "active" : ""}" data-hrv-series="${key}" data-athlete="${esc(a.id)}">${esc(label)}</button>`
    ).join("");

    const verdict = hrvVerdictAt(a, index);
    const test = (a.hrv || [])[index];
    const wellnessValues = (a.hrv || []).map(x => x.wellness).filter(v => v != null);
    const wellnessRef = wellnessValues.length ? median(wellnessValues) : null;

    // Both sides read against this athlete's own habit — the same principle as
    // every other number here, and it avoids inventing a population threshold
    // for "feels fine".
    const reading = !verdict ? null : verdict.pattern ? "bad" : (verdict.smallBase || !verdict.reliable) ? "doubtful" : "good";
    const feeling = (test && test.wellness != null && wellnessRef != null)
      ? (test.wellness >= wellnessRef ? "good" : "bad") : null;
    const agreementHTML = (reading && feeling)
      ? `<div class="hrv-accord">
          <div class="why-line"><span>${t("Ressenti déclaré")}</span><span class="hrv-chip ${feeling === "good" ? "up" : "down"}">${test.wellness} %</span></div>
          <div class="why-line"><span>${t("Lecture HRV")}</span><span class="hrv-chip ${reading === "good" ? "up" : reading === "bad" ? "down" : "warn"}">${
            t(reading === "good" ? "favorable" : reading === "bad" ? "défavorable" : "douteuse")}</span></div>
          <div class="why-line"><span>${t("Accord")}</span><span class="hrv-chip ${
            (reading === "good") === (feeling === "good") ? "flat" : "warn"}">${
            t((reading === "good") === (feeling === "good") ? "les deux concordent" : "en désaccord")}</span></div>
        </div>` : "";

    return `<div class="hrv-panel">
      <p class="block-t">${t("Suivi")} · ${t("12 derniers tests")}</p>
      <div class="hrv-seg">${tabs}</div>
      ${hrvSeriesSVG(a, series[2], series[1])
        || `<p class="chart-note">${t("Deux tests au moins sont nécessaires pour tracer une tendance.")}</p>`}
      <div class="hrv-legend">
        <span class="hrv-key"><i class="hrv-swatch band"></i>${t("zone habituelle · médiane ±20 %")}</span>
        <span class="hrv-key">${t("échelle logarithmique")}</span>
      </div>
      ${agreementHTML}
      <p class="chart-note">${t("La bande est la zone habituelle de cet athlète, pas une norme de population. Le ressenti est comparé à sa propre médiane : c'est leur désaccord qui informe, pas chacun pris seul.")}</p>
    </div>`;
  }

  /// LF and HF, both positions, each against its own reference.
  ///
  /// Four bars and four reference marks. The verdict is expressed on exactly
  /// these four numbers, so this is the picture that makes it legible: a coach
  /// who sees the bars can judge, one who sees only the conclusion has to take
  /// it on trust. Bars share one linear scale because comparing LF with HF
  /// within a position is the point; the reference tick is per bar.
  function hrvBarsSVG(a, index) {
    const tests = a.hrv || [];
    if (index < 1) return "";
    const current = tests[index];
    const earlier = tests.slice(Math.max(0, index - 6), index);
    if (!earlier.length) return "";

    const bars = [
      { label: "LF", pos: t("couché"), v: current.supine.lf,   ref: median(earlier.map(x => x.supine.lf)),   fill: "var(--i2)" },
      { label: "HF", pos: t("couché"), v: current.supine.hf,   ref: median(earlier.map(x => x.supine.hf)),   fill: "var(--accent)" },
      { label: "LF", pos: t("debout"), v: current.standing.lf, ref: median(earlier.map(x => x.standing.lf)), fill: "var(--i2)" },
      { label: "HF", pos: t("debout"), v: current.standing.hf, ref: median(earlier.map(x => x.standing.hf)), fill: "var(--accent)" },
    ];

    const w = 280, h = 150, padL = 34, padR = 8, padT = 10, padB = 30;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const top = Math.max(...bars.flatMap(b => [b.v, b.ref]), 1) * 1.12;
    const yFor = v => padT + plotH - (v / top) * plotH;

    // Two groups of two, with a gap between the positions — the eye should
    // compare LF against HF inside a position before comparing positions.
    const slot = plotW / 4.6;
    const bw = slot * 0.62;
    const xs = [0, 1, 2.3, 3.3].map(k => padL + k * slot + (slot - bw) / 2);

    const ticks = [0, top / 2, top].map(v => `
      <line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w - padR}" y2="${yFor(v).toFixed(1)}"
            stroke="var(--border)" stroke-width="1"/>
      <text x="${padL - 5}" y="${yFor(v).toFixed(1)}" text-anchor="end" dominant-baseline="middle"
            font-size="9" fill="var(--ink-muted)">${Math.round(v)}</text>`).join("");

    const rects = bars.map((b, i) => {
      const yv = yFor(b.v), yr = yFor(b.ref);
      const tip = `${b.label} ${b.pos} — ${Math.round(b.v)} ms² · ${t("réf.")} ${Math.round(b.ref)} ms²`;
      return `
        <rect x="${xs[i].toFixed(1)}" y="${yv.toFixed(1)}" width="${bw.toFixed(1)}"
              height="${Math.max(0, padT + plotH - yv).toFixed(1)}" rx="2" fill="${b.fill}"><title>${esc(tip)}</title></rect>
        <line x1="${(xs[i] - 2).toFixed(1)}" y1="${yr.toFixed(1)}" x2="${(xs[i] + bw + 2).toFixed(1)}" y2="${yr.toFixed(1)}"
              stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round"/>
        <text x="${(xs[i] + bw / 2).toFixed(1)}" y="${h - 16}" text-anchor="middle"
              font-size="10" fill="var(--ink-soft)">${b.label}</text>`;
    }).join("");

    const groups = [[0, 1, t("couché")], [2, 3, t("debout")]].map(([i, j, label]) =>
      `<text x="${((xs[i] + xs[j] + bw) / 2).toFixed(1)}" y="${h - 4}" text-anchor="middle"
             font-size="9" fill="var(--ink-muted)">${esc(label)}</text>`).join("");

    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("LF et HF dans les deux positions, comparés à leur référence")}">
      ${ticks}${rects}${groups}</svg>`;
  }

  /// One measure across the tests, on a log scale, inside its usual zone.
  ///
  /// Logarithmic because a single 9452 against a usual 700–1500 flattens every
  /// other point onto the axis, and the flattened points are the ones being
  /// read. The band is the running median ±20 %: it turns "is this high" — a
  /// question needing the athlete's whole history — into "is it outside the
  /// band", which is a glance.
  function hrvSeriesSVG(a, pick, label) {
    const tests = (a.hrv || []).slice(-12);
    const values = tests.map(pick).filter(v => v > 0);
    if (values.length < 2) return "";

    const w = 280, h = 130, padL = 36, padR = 8, padT = 10, padB = 18;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const lo = Math.log10(Math.min(...values) * 0.8);
    const hi = Math.log10(Math.max(...values) * 1.25);
    const xFor = i => padL + (tests.length > 1 ? (i / (tests.length - 1)) * plotW : plotW / 2);
    const yFor = v => padT + plotH - ((Math.log10(v) - lo) / (hi - lo || 1)) * plotH;

    const mid = median(values);
    const band = `<rect x="${padL}" y="${yFor(mid * 1.2).toFixed(1)}" width="${plotW}"
      height="${Math.abs(yFor(mid * 0.8) - yFor(mid * 1.2)).toFixed(1)}"
      fill="var(--accent-soft)" stroke="var(--accent)" stroke-opacity=".35" stroke-width="1"/>`;

    const pts = tests.map((test, i) => ({ i, v: pick(test), date: test.date })).filter(p => p.v > 0);
    const path = pts.map((p, k) => (k === 0 ? "M" : "L") + xFor(p.i).toFixed(1) + " " + yFor(p.v).toFixed(1)).join(" ");
    const dots = pts.map(p => `<circle cx="${xFor(p.i).toFixed(1)}" cy="${yFor(p.v).toFixed(1)}" r="2.6"
      fill="var(--accent)"><title>${esc(shortDate(p.date) + " — " + Math.round(p.v))}</title></circle>`).join("");

    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">
      ${band}
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
      ${dots}
      <text x="${padL - 5}" y="${yFor(mid).toFixed(1)}" text-anchor="end" dominant-baseline="middle"
            font-size="9" fill="var(--ink-muted)">${Math.round(mid)}</text>
    </svg>`;
  }

  function radarSVG(a) {
    const peers = peerGroup(a);
    const n = RADAR_WINDOWS.length;
    const cx = 130, cy = 116, R = 84;
    const angleFor = i => (Math.PI * 2 * i / n) - Math.PI / 2;
    const radiusFor = pct => R * Math.max(0, Math.min(1, (pct - RADAR_SCALE_MIN) / (100 - RADAR_SCALE_MIN)));
    const pts = RADAR_WINDOWS.map((wnd, i) => {
      // Include the athlete's own record: they are by definition part of
      // their category, so an empty peer group should read as "best of the
      // field" rather than silently flattening the chart to nothing.
      const best = Math.max(a.records[wnd] || 0, ...peers.map(p => p.records[wnd] || 0));
      const pct = best > 0 ? Math.min(100, Math.round((a.records[wnd] / best) * 100)) : 0;
      return { wnd, pct, value: a.records[wnd], best, angle: angleFor(i) };
    });

    const ringPath = frac => RADAR_WINDOWS.map((_, i) => {
      const ang = angleFor(i);
      const x = cx + Math.cos(ang) * R * frac, y = cy + Math.sin(ang) * R * frac;
      return (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
    }).join(" ") + " Z";
    const rings = [0.25, 0.5, 0.75, 1].map(f => `<path d="${ringPath(f)}" fill="none" stroke="var(--border)" stroke-width="1"/>`).join("");
    const spokes = RADAR_WINDOWS.map((_, i) => {
      const ang = angleFor(i);
      const x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * R;
      return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    }).join("");
    const scaleTicks = [50, 75, 100].map(v => {
      const y = cy - R * (v - RADAR_SCALE_MIN) / (100 - RADAR_SCALE_MIN);
      return `<text x="${(cx - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-muted)">${v}%</text>`;
    }).join("");

    const dataPath = pts.map((p, i) => {
      const r = radiusFor(p.pct);
      const x = cx + Math.cos(p.angle) * r, y = cy + Math.sin(p.angle) * r;
      return (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
    }).join(" ") + " Z";
    const visibleDots = pts.map(p => {
      const r = radiusFor(p.pct);
      const x = cx + Math.cos(p.angle) * r, y = cy + Math.sin(p.angle) * r;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="var(--accent)"/>`;
    }).join("");
    const dots = pts.map(p => {
      const r = radiusFor(p.pct);
      const x = cx + Math.cos(p.angle) * r, y = cy + Math.sin(p.angle) * r;
      const label = `${RADAR_LABELS[p.wnd]} — ${p.pct}%`;
      const value = `${p.value.toFixed(2)} m/s² (meilleur ${p.best.toFixed(2)})`;
      return `<circle class="hoverpt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="transparent" data-label="${label}" data-value="${value}"/>`;
    }).join("");
    const labels = RADAR_WINDOWS.map((wnd, i) => {
      const ang = angleFor(i);
      const x = cx + Math.cos(ang) * (R + 18), y = cy + Math.sin(ang) * (R + 18);
      return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="var(--ink-muted)">${RADAR_LABELS[wnd]}</text>`;
    }).join("");

    const svg = `<svg width="100%" viewBox="0 0 260 232" role="img" aria-label="${t("Comparaison en pourcentage du meilleur de la catégorie, échelle 50 à 100%")}">
      ${rings}${spokes}
      <path d="${dataPath}" fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      ${visibleDots}${scaleTicks}${labels}${dots}
    </svg>`;
    return { svg, peerCount: peers.length };
  }

  /// Session vs. own-record curve — same 6 windows as the radar, evenly spaced
  /// by index (not by actual seconds) so a short 5s-45s gap doesn't visually
  /// dwarf the 45s-3min gap, matching the app's own categorical-axis chart.
  // ── Évolution de la charge dans le temps ──────────────────────────────
  //
  // L'app trace les mêmes zones en barres empilées, une barre par séance.
  // Ici ce sont des aires empilées, un point par *jour* : l'entraîneur lit
  // des semaines d'un coup d'œil, et deux sorties le mardi font la charge
  // d'un mardi, pas deux objets à distinguer. Les jours sans séance valent
  // zéro et ne sont pas sautés — un creux dans l'entraînement est
  // précisément ce qu'on vient lire.
  function loadTrendSeries(a, days) {
    const sessions = a.sessions.filter(matchesFilterMode);
    if (!sessions.length) return null;
    const byDay = new Map();
    sessions.forEach(s => {
      const cur = byDay.get(s.date) || { hr: [0, 0, 0], mech: [0, 0, 0], count: 0 };
      for (let i = 0; i < 3; i++) { cur.hr[i] += s.hr[i]; cur.mech[i] += s.mech[i]; }
      cur.count += 1;
      byDay.set(s.date, cur);
    });

    const today = new Date(); today.setHours(12, 0, 0, 0);
    let start;
    if (days > 0) {
      start = new Date(today); start.setDate(start.getDate() - days + 1);
    } else {
      start = new Date([...byDay.keys()].sort()[0] + "T12:00:00");
    }
    const out = [];
    for (const d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
      const iso = isoDate(d);
      const v = byDay.get(iso);
      out.push({ iso, hr: v ? v.hr : [0, 0, 0], mech: v ? v.mech : [0, 0, 0], count: v ? v.count : 0 });
    }
    return out;
  }

  // Les zones masquées par l'entraîneur, par graphique. Un Set d'index 0/1/2,
  // sur le modèle d'activeAthletes dans le calendrier.
  const loadTrendHidden = { hr: new Set(), mech: new Set() };

  function loadTrendSVG(points, kind) {
    const w = 900, h = 210, padL = 38, padR = 12, padT = 12, padB = 24;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const key = kind === "hr" ? "hr" : "mech";
    const colors = kind === "hr"
      ? ["var(--i1)", "var(--i2)", "var(--i3)"]
      : ["var(--z1)", "var(--z2)", "var(--z3)"];
    const names = kind === "hr"
      ? ["I1", "I2", "I3"]
      : [t("Zone 1"), t("Zone 2"), t("Zone 3")];
    const hidden = loadTrendHidden[key];
    const shown = [0, 1, 2].filter(j => !hidden.has(j));

    const n = points.length;
    // Un jour est une colonne, pas un point d'une courbe : relier deux jours
    // par une droite inventait une montée et une descente là où il n'y avait
    // qu'une séance. Les colonnes sont séparées par un jour de blanc — ça
    // ressemble à un histogramme, et c'en est un : chaque jour est un objet
    // distinct, pas un échantillon d'un signal continu.
    const bw = plotW / n;
    // L'écart suit la largeur de bande et se plafonne : sur « Tout », une
    // bande peut faire deux unités, et un écart fixe mangerait la colonne.
    const gap = Math.min(bw * 0.3, 7);
    const colW = Math.max(bw - gap, 0.8);
    const xa = i => padL + i * bw + gap / 2;
    const xm = i => padL + i * bw + bw / 2;

    // Masquer une zone la retire de l'empilement et redescend les autres :
    // c'est ce qui rend le geste utile plutôt que décoratif.
    const cum = points.map(p => {
      let acc = 0;
      return [0, 1, 2].map(j => { if (!hidden.has(j)) acc += p[key][j] / 60; return acc; });
    });
    const maxV = Math.max(1, ...cum.map(c => c[2]));
    const yFor = v => padT + plotH - (v / maxV) * plotH;
    const floorFor = (i, j) => {
      const below = shown.filter(k => k < j);
      return below.length ? cum[i][below[below.length - 1]] : 0;
    };

    // Un rectangle par zone et par jour. Pas de hauteur minimale : une journée
    // presque vide doit paraître presque vide, l'infobulle donne le chiffre.
    const bands = shown.map(j => points.map((p, i) => {
      const top = yFor(cum[i][j]), bottom = yFor(floorFor(i, j));
      const hgt = bottom - top;
      if (!(hgt > 0.05)) return "";
      return `<rect x="${xa(i).toFixed(1)}" y="${top.toFixed(1)}" width="${colW.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${colors[j]}" fill-opacity="0.8"/>`;
    }).join("")).join("");
    const totalLine = "";

    // La cible est la colonne elle-même : on survole et on clique la barre
    // qu'on regarde. Une hauteur de préhension minimale de 16 unités garde
    // une journée presque vide atteignable — c'est une zone sensible, pas une
    // valeur dessinée, donc la hauteur affichée ne ment pas pour autant.
    const dots = points.map((p, i) => {
      if (!p.count || !shown.length) return "";
      const z = p[key];
      if (!shown.reduce((acc, j) => acc + z[j], 0)) return "";
      const value = shown.map(j => names[j] + " " + fmtMinSec(z[j])).join(" · ")
        + " · " + t("total") + " " + fmtMinSec(shown.reduce((acc, j) => acc + z[j], 0))
        + (p.count > 1 ? " · " + p.count + " " + t("séances") : "");
      const base = yFor(0), top = Math.min(yFor(cum[i][2]), base - 16);
      return `<rect class="hoverpt load-trend-day" x="${xa(i).toFixed(1)}" y="${top.toFixed(1)}" width="${colW.toFixed(1)}" height="${(base - top).toFixed(1)}" fill="transparent" data-day="${p.iso}" data-label="${shortDate(p.iso)}" data-value="${esc(value)}" role="button" tabindex="0" aria-label="${t("Voir cette journée dans le calendrier")} — ${shortDate(p.iso)}"/>`;
    }).join("");

    const yTicks = [0, 0.5, 1].map(fr => {
      const y = yFor(maxV * fr);
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`
        + `<text x="${padL - 6}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="var(--ink-muted)">${Math.round(maxV * fr)}</text>`;
    }).join("");

    const step = Math.max(1, Math.round((n - 1) / 6));
    const xLabels = points.map((p, i) =>
      (i % step === 0 || i === n - 1)
        ? `<text x="${xm(i).toFixed(1)}" y="${h - 7}" text-anchor="middle" font-size="9" fill="var(--ink-muted)">${shortDate(p.iso)}</text>`
        : "").join("");

    return `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Évolution du temps passé dans chaque zone, jour par jour")}" style="height:auto">
      ${yTicks}${bands}${totalLine}${xLabels}${dots}
    </svg>`;
  }

  function loadTrendCard(a, kind) {
    const points = loadTrendSeries(a, loadTrendDays);
    const title = kind === "hr" ? t("Évolution — charge cardio") : t("Évolution — charge mécanique");
    const names = kind === "hr"
      ? [["I1", "var(--i1)"], ["I2", "var(--i2)"], ["I3", "var(--i3)"]]
      : [[t("Zone 1"), "var(--z1)"], [t("Zone 2"), "var(--z2)"], [t("Zone 3"), "var(--z3)"]];
    // Mêmes pastilles que les athlètes du calendrier : même geste, même
    // affordance, rien de nouveau à apprendre.
    const key = kind === "hr" ? "hr" : "mech";
    const hidden = loadTrendHidden[key];
    const legend = names.map(([nm, c], j) => {
      const on = !hidden.has(j);
      return `<span class="chip ${on ? "" : "off"}" data-kind="${key}" data-zone="${j}" tabindex="0" role="button" aria-pressed="${on}" title="${t("Afficher ou masquer cette zone")}">
        <span class="dot" style="background:${c}"></span>${nm}</span>`;
    }).join("");
    const allHidden = hidden.size === 3;
    const hasData = points && points.some(p => p.count);
    const seg = kind === "hr" ? `<span class="seg" id="loadTrendSeg">${LOAD_TREND_PERIODS.map(d =>
      `<button data-days="${d}" class="${d === loadTrendDays ? "active" : ""}">${t(LOAD_TREND_LABEL[d])}</button>`).join("")}</span>` : "";

    return `<div class="detail-section" style="grid-column:1/-1">
      <div class="load-trend-head">
        <h3 style="margin:0">${title} <span class="load-trend-unit">${t("minutes par jour")}</span></h3>
        ${seg}
      </div>
      ${hasData
        ? `<div class="chart-wrap">${loadTrendSVG(points, kind)}<div class="tooltip"></div></div>
           <div class="legend load-trend-legend">${legend}</div>
           ${allHidden ? `<p class="chart-note">${t("Toutes les zones sont masquées — reclique une pastille pour la réafficher.")}</p>` : ""}`
        : `<p class="empty-note">${t("Aucune séance sur cette période.")}</p>`}
      ${kind === "hr" && hasData
        ? `<p class="chart-note">${t("Une colonne par jour : sa hauteur est le volume de la journée, empilé par zone. Plusieurs séances dans la même journée sont additionnées ; un jour sans séance n'a pas de colonne. Clique une colonne pour ouvrir la journée de cet athlète dans le calendrier, ou une pastille pour masquer une zone.")}</p>`
        : ""}
    </div>`;
  }

  function mechCurveSVG(a) {
    const w = 280, h = 200, padL = 34, padR = 14, padT = 14, padB = 26;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const n = RADAR_WINDOWS.length;
    const xFor = i => padL + (n > 1 ? (i / (n - 1)) * plotW : plotW / 2);

    const sessionVals = RADAR_WINDOWS.map(wnd => a.lastSessionPeaks ? a.lastSessionPeaks[String(wnd)] : null);
    // Null when the last session's boat is unknown: there is no record that
    // compares to it, and drawing the wrong boat's record would be worse than
    // drawing none.
    const recordVals = RADAR_WINDOWS.map(wnd => a.curveRecords ? a.curveRecords[wnd] : null);
    const allVals = [...sessionVals, ...recordVals].filter(v => v != null);
    const maxV = allVals.length ? Math.max(...allVals) : 1;
    const yFor = v => padT + plotH - (v / (maxV || 1)) * plotH;

    const lineFor = (vals, dashed) => {
      const pts = vals.map((v, i) => v == null ? null : [xFor(i), yFor(v)]);
      let path = "";
      pts.forEach((p, i) => {
        if (!p) return;
        path += (path === "" ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1) + " ";
      });
      const dash = dashed ? ' stroke-dasharray="5 4"' : "";
      return { path: path.trim(), pts };
    };

    const sessionLine = lineFor(sessionVals, false);
    const recordLine = lineFor(recordVals, true);

    const dotsFor = (line, label) => line.pts.map((p, i) => {
      if (!p) return "";
      const val = (label === t("Séance") ? sessionVals : recordVals)[i];
      const when = label === t("Record") && a.curveRecordDates ? a.curveRecordDates[RADAR_WINDOWS[i]] : null;
      const value = val.toFixed(2) + " m/s²" + (when ? " · " + shortDate(when) : "");
      return `<circle class="hoverpt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="8" fill="transparent" data-label="${RADAR_LABELS[RADAR_WINDOWS[i]]} — ${label}" data-value="${value}"/>`;
    }).join("");
    const visibleDotsFor = (line, color) => line.pts.map(p => p ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${color}"/>` : "").join("");

    const xLabels = RADAR_WINDOWS.map((wnd, i) => `<text x="${xFor(i).toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10" fill="var(--ink-muted)">${RADAR_LABELS[wnd]}</text>`).join("");
    const yTicks = [0, 0.5, 1].map(f => {
      const val = maxV * f;
      const y = yFor(val);
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
        <text x="${(padL - 6).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="var(--ink-muted)">${val.toFixed(1)}</text>`;
    }).join("");

    const svg = `<svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Courbe d'accélération de la dernière séance comparée au record personnel, sur les six fenêtres de temps")}">
      ${yTicks}
      <path d="${recordLine.path}" fill="none" stroke="var(--ink-muted)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${sessionLine.path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${visibleDotsFor(recordLine, "var(--ink-muted)")}
      ${visibleDotsFor(sessionLine, "var(--accent)")}
      ${xLabels}
      ${dotsFor(recordLine, "Record")}
      ${dotsFor(sessionLine, t("Séance"))}
    </svg>`;
    return svg;
  }

  function detailHTML(a) {
    const trend = trendDelta(a.history);
    const w = 560, h = 160, padL = 30, padB = 24, padT = 12;
    const vals = a.history.length ? a.history.map(p => p.v) : [0];
    const denom = vals.length > 1 ? vals.length - 1 : 1;
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = (max - min) || 1;
    const plotW = w - padL - 12, plotH = h - padT - padB;
    const pts = vals.map((v,i) => {
      const x = padL + (i/denom) * plotW;
      const y = padT + plotH - ((v-min)/span) * plotH;
      return [x,y];
    });
    const path = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const dots = a.history.length
      ? pts.map((p,i) => `<circle class="hoverpt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="transparent" data-label="${a.history[i].d}" data-value="${a.history[i].v.toFixed(2)} m/s²"/>`).join("")
      : "";
    const visibleDots = pts.map((p) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="var(--accent)"/>`).join("");
    const xLabels = a.history.map((p,i) => `<text class="ts" x="${pts[i][0].toFixed(1)}" y="${h-6}" text-anchor="middle" fill="var(--ink-muted)" font-size="10">${p.d}</text>`).join("");
    const gridLine = `<line x1="${padL}" y1="${padT+plotH}" x2="${w-8}" y2="${padT+plotH}" stroke="var(--border)" stroke-width="1"/>`;

    const radar = radarSVG(a);
    const categoryLabel = `${GENDER_LABEL[a.gender]} · ${a.boatType}`;
    const radarNote = radar.peerCount <= 1
      ? `<p class="empty-note" style="margin-top:0.6rem">${t("Seul(e) athlète")} ${categoryLabel} ${t("— pas de comparaison possible.")}</p>`
      : `<p class="athlete-meta" style="margin-top:0.6rem">${categoryLabel} · ${radar.peerCount} ${t("athlètes")}</p>`;

    return `
      <div class="detail-head">
        <button class="back-btn" id="backBtn">${t("‹ Retour à la vue d'ensemble")}</button>
      </div>
      <p class="detail-title">${esc(a.name)}</p>
      <div class="session-head">
      <p class="athlete-meta" style="margin:0">${a.isSpecificSession ? t("Séance") : t("Dernière séance")}${t(" : ")}${a.lastSessionName ? esc(a.lastSessionName) + " · " : ""}${relDate(a.lastSession)} · ${a.duration} min · RPE ${rpeLabel(a.rpe)}${a.lastSessionIsTest ? t(" · Test") : ""}${a.lastSessionIsConditioning ? t(" · PPG") : ""} ${a.note ? "— " + esc(a.note) : ""}</p>
      ${sessionNavHTML(a)}
      </div>
      <div class="detail-grid">
        <div class="detail-section">
          <h3>${t("Répartition — dernière séance")}</h3>
          <div class="bar-row" style="margin-bottom:10px">
            <div class="bar-label"><span>${t("Cardio")}</span></div>
            <div class="bar" style="height:12px">${stackBar(a.hr, ["var(--i1)","var(--i2)","var(--i3)"])}</div>
            <div class="legend">
              <span class="legend-item"><span class="legend-dot" style="background:var(--i1)"></span>I1 ${fmtMinSec(a.hr[0])}</span>
              <span class="legend-item"><span class="legend-dot" style="background:var(--i2)"></span>I2 ${fmtMinSec(a.hr[1])}</span>
              <span class="legend-item"><span class="legend-dot" style="background:var(--i3)"></span>I3 ${fmtMinSec(a.hr[2])}</span>
            </div>
          </div>
          ${a.lastSessionIsConditioning ? `
          <p class="chart-note">${t("Séance PPG — pas de charge mécanique. La marche, la course et les pauses sont comptées dans le cardio.")}</p>` : `
          <div class="bar-row">
            <div class="bar-label"><span>${t("Mécanique")}</span></div>
            <div class="bar" style="height:12px">${stackBar(a.mech, ["var(--z1)","var(--z2)","var(--z3)"])}</div>
            <div class="legend">
              <span class="legend-item"><span class="legend-dot" style="background:var(--z1)"></span>Zone 1 ${fmtMinSec(a.mech[0])}</span>
              <span class="legend-item"><span class="legend-dot" style="background:var(--z2)"></span>Zone 2 ${fmtMinSec(a.mech[1])}</span>
              <span class="legend-item"><span class="legend-dot" style="background:var(--z3)"></span>Zone 3 ${fmtMinSec(a.mech[2])}</span>
            </div>
          </div>`}
        </div>
        ${!a.strokeSignal ? "" : `
        <div class="detail-section" style="grid-column:1/-1">
          <h3>${t("Coup de pagaie — 9 meilleures secondes")}<button class="help" aria-label="${t("Explication")}">?<span>${t("Le signal d'accélération sur les neuf meilleures secondes de la séance. Chaque bosse est un coup : on y lit la montée en charge, le placement du pic et la propreté du retour. La partie basse de la courbe est la décélération entre deux coups. La courbe est légèrement lissée (5 échantillons, moins d'un dixième de seconde) ; survole-la pour lire les valeurs. Uniquement sur les séances de test, où les conditions sont comparables.")}</span></button></h3>
          <div class="chart-wrap">${strokeSVG(a)}<div class="tooltip"></div></div>
          <p class="chart-note">${t("secondes")}</p>
        </div>`}
        ${a.lastSessionIsConditioning ? "" : `
        <div class="detail-section">
          <h3>${t("Temps au-dessus de la référence 45 s")}<button class="help" aria-label="${t("Explication")}">?<span>${t("Temps passé à pagayer plus fort que la référence 45 s confirmée de l'athlète. Compté seconde par seconde sur le signal brut : les zones lissent sur 15 secondes et ne peuvent pas voir un effort plus court, celui-ci si.")}</span></button></h3>
          ${aboveHTML(a)}
        </div>`}
        <div class="detail-section">
          <h3>${t("Tendance — pic d'accélération 45 s")} <span class="trend-delta ${trend.dir}">${trend.label}</span></h3>
          <div class="chart-wrap">
            <svg width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Évolution du pic d'accélération 45 secondes")}">
              ${gridLine}
              <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              ${visibleDots}
              ${xLabels}
              ${dots}
            </svg>
            <div class="tooltip"></div>
          </div>
        </div>
        <div class="detail-section"${a.lastSessionIsConditioning ? ' hidden' : ''}>
          <h3>${t("Courbe — dernière séance vs record")}</h3>
          <div class="chart-wrap">
            ${mechCurveSVG(a)}
            <div class="tooltip"></div>
          </div>
          <div class="legend" style="margin-top:0.5rem">
            <span class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>${t("Séance")}</span>
            ${a.curveRecords ? `<span class="legend-item"><span class="legend-dot" style="background:var(--ink-muted)"></span>${t("Record")} · ${esc(a.curveBoat)}</span>` : ""}
          </div>
          <!-- Each window's record can come from a different session, so the
               date belongs to the point rather than to the curve. -->
          ${a.curveRecords
            ? `<p class="chart-note">${t("Survole un point du record pour voir sa valeur et la date où il a été établi.")}</p>`
            : `<p class="chart-note invite-warn">${t("Embarcation non renseignée sur cette séance — aucun record comparable. L'athlète peut la choisir dans le détail de la séance.")}</p>`}
        </div>
        <div class="detail-section">
          <h3>${t("Records tous temps par fenêtre — % du meilleur de la catégorie (échelle 50-100 %)")}</h3>
          <div class="chart-wrap">
            ${radar.svg}
            <div class="tooltip"></div>
          </div>
          ${radarNote}
          ${boatPickerHTML(a)}
        </div>
        <div class="detail-section">
          <h3>${t("Test HRV du matin")}<button class="help" aria-label="${t("Explication")}">?<span>${t("Le dernier test orthostatique de l'athlète et les quatre écarts sur lesquels la cascade de motifs se prononce. Les seuils qui les interprètent sont juste en dessous.")}</span></button></h3>
          ${hrvDetailHTML(a)}
        </div>
        ${loadTrendCard(a, "hr")}
        ${loadTrendCard(a, "mech")}
      </div>`;
  }

  /// Lets the coach say which boat an athlete should be read as, because the
  /// rule below can only guess. Shown under the radar, since it is what the
  /// radar and the records are grouped by.
  function boatPickerHTML(a) {
    if (a.availableBoats.length < 2 && !a.boatIsOverridden) return "";
    const buttons = a.availableBoats.map(boat =>
      `<button data-boat="${esc(boat)}" class="${boat === a.boatType ? "active" : ""}">${esc(boat)}</button>`
    ).join("");
    const reset = a.boatIsOverridden
      ? ` <button class="link-btn" id="boatReset">${t("Revenir à")} ${esc(a.defaultBoatType)} ${t("(automatique)")}</button>`
      : "";
    return `<div class="boat-picker">
      <span class="boat-picker-label">${t("Embarcation analysée")}</span>
      <span class="seg" id="boatSeg">${buttons}</span>${reset}
      <p class="chart-note">${t("Records et comparaison ne portent que sur les séances dans cette embarcation.")}${
        a.boatIsOverridden ? "" : `${t(" Par défaut, la plus utilisée")}${a.availableBoats.length > 1 ? t(" de son historique") : ""}.`
      }</p>
    </div>`;
  }

  const grid = document.getElementById("grid");
  const detail = document.getElementById("detail");

  function renderableAthletes() {
    return athletes.filter(a => a.sessions.some(matchesFilterMode));
  }

  function render() {
    const renderable = renderableAthletes();
    grid.innerHTML = renderable.length
      ? renderable.map(cardHTML).join("")
      : `<p class="empty-note">${t("En attente de la première séance synchronisée…")}</p>`;
    grid.querySelectorAll(".card").forEach(card => {
      const open = () => showDetail(card.dataset.id);
      card.addEventListener("click", open);
      card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  }

  let openDetailId = null;
  /// Set when the detail shows one particular session rather than the latest —
  /// clicking a day in the calendar, for instance. A session id rather than a
