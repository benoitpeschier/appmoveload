  /// date: a day can hold several, and a date could only ever name the first.
  let openDetailSession = null;

  /// The athlete's sessions in the order the arrows walk them: oldest first,
  /// by the full instant rather than the day, since four sessions in one
  /// morning is an ordinary test day.
  ///
  /// Filtered exactly as `deriveAthlete` filters them, so the arrows never
  /// step to a session the page would refuse to show.
  function navigableSessions(a) {
    return [...(a.sessions || [])].filter(matchesFilterMode)
      .sort((x, y) => (x.startedAt || 0) - (y.startedAt || 0));
  }

  /// « ‹ Précédente » and « Suivante › », greyed at the ends.
  ///
  /// Chronological, not list order: previous means older. Stepping onto the
  /// most recent session passes no id at all, so the heading goes back to
  /// saying "Dernière séance" rather than "Séance" — the same view should not
  /// describe itself two ways depending on how it was reached.
  function sessionNavHTML(a) {
    const list = navigableSessions(a);
    const current = a.lastSessionId;
    const i = list.findIndex(x => x.id === current);
    if (i < 0 || list.length < 2) return "";
    const older = list[i - 1], newer = list[i + 1];
    const lastId = list[list.length - 1].id;
    const attr = (s) => s ? `data-session="${s.id === lastId ? "" : s.id}"` : "disabled";
    const label = (s) => s ? `${relDate(s.date)} · ${s.duration} min` : "";
    return `<span class="session-nav">
      <button id="prevSessionBtn" ${attr(older)} title="${t("Séance précédente de cet athlète")}${older ? " — " + label(older) : ""}">${t("‹ Précédente")}</button>
      <button id="nextSessionBtn" ${attr(newer)} title="${t("Séance suivante de cet athlète")}${newer ? " — " + label(newer) : ""}">${t("Suivante ›")}</button>
    </span>`;
  }

  /// A copy of the athlete whose "last session" fields describe `sessionId`
  /// instead, so the detail view can render any session without duplicating it.
  function athleteViewFor(a, sessionId) {
    if (!sessionId) return a;
    const s = a.sessions.find(x => x.id === sessionId);
    if (!s) return a;
    return Object.assign({}, a, {
      lastSession: s.date,
      duration: s.duration,
      // Deliberately NOT overriding boatType. It is an athlete-level
      // property — the coach's choice, or the boat they use most — and it
      // decides both which sessions count towards their records and who
      // their peer group is. Replacing it with the viewed session's boat
      // emptied the peer group whenever the two differed (a session synced
      // without a boat type set it to null), and the radar collapsed to a
      // dot with no error anywhere.
      hr: s.hr,
      mech: s.mech,
      aboveAnchor: s.aboveAnchor,
      rpe: s.rpe,
      lastSessionIsTest: !!s.isTest,
      lastSessionIsConditioning: !!s.isConditioning,
      strokeSignal: s.strokeSignal,
      strokeRateHz: s.strokeRateHz,
      lastSessionName: s.name || "",
      lastSessionPeaks: s.mechanicalPeaks || {},
      lastSessionId: s.id,
      // The "nothing since N days" note is about how recent the athlete's
      // training is, which says nothing about the session being looked at.
      note: null,
      isSpecificSession: true
    });
  }

  function renderDetail(id, sessionId) {
    const a = athleteViewFor(athletes.find(x => x.id === id), sessionId);
    openDetailId = id;
    openDetailSession = sessionId || null;
    detail.innerHTML = detailHTML(a);
    detail.classList.add("open");
    for (const which of ["prevSessionBtn", "nextSessionBtn"]) {
      const btn = document.getElementById(which);
      if (btn && !btn.disabled) {
        btn.addEventListener("click", () => renderDetail(id, btn.dataset.session || null));
      }
    }
    document.getElementById("backBtn").addEventListener("click", () => {
      openDetailId = null;
      openDetailSession = null;
      detail.classList.remove("open");
      detail.innerHTML = "";
    });
    // Re-derive rather than patch: changing the boat changes the records, the
    // peer group and the curve, all of which are computed in deriveAthlete.
    const rerenderWithBoat = boat => {
      setBoatOverride(id, boat);
      const athlete = athletes.find(x => x.id === id);
      if (athlete) deriveAthlete(athlete);
      renderDetail(id, sessionId);
      render();
    };

    detail.querySelectorAll("#boatSeg button").forEach(btn => {
      btn.addEventListener("click", () => rerenderWithBoat(btn.dataset.boat));
    });
    const boatReset = document.getElementById("boatReset");
    if (boatReset) boatReset.addEventListener("click", () => rerenderWithBoat(null));

    detail.querySelectorAll("#loadTrendSeg button").forEach(btn => {
      btn.addEventListener("click", () => {
        loadTrendDays = Number(btn.dataset.days);
        renderDetail(id, sessionId);
      });
    });

    detail.querySelectorAll(".load-trend-day").forEach(col => {
      const open = () => openCalendarOn(col.dataset.day, id);
      col.addEventListener("click", open);
      col.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    });

    detail.querySelectorAll("[data-hrv-jump]").forEach(bar => {
      const open = () => openHrvOn([[id, bar.dataset.hrvJump]]);
      bar.addEventListener("click", open);
      bar.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    });

    detail.querySelectorAll(".load-trend-legend .chip").forEach(chip => {
      const toggle = () => {
        const set = loadTrendHidden[chip.dataset.kind];
        const zone = Number(chip.dataset.zone);
        if (set.has(zone)) set.delete(zone); else set.add(zone);
        renderDetail(id, sessionId);
      };
      chip.addEventListener("click", toggle);
      chip.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });

    detail.querySelectorAll(".hoverpt").forEach(pt => {
      const wrapEl = pt.closest(".chart-wrap");
      const tip = wrapEl.querySelector(".tooltip");
      pt.addEventListener("mouseenter", () => {
        const wrap = wrapEl.getBoundingClientRect();
        const ptRect = pt.getBoundingClientRect();
        tip.textContent = pt.dataset.label + " · " + pt.dataset.value;
        tip.style.left = (ptRect.left + ptRect.width / 2 - wrap.left) + "px";
        tip.style.top = (ptRect.top + ptRect.height / 2 - wrap.top) + "px";
        tip.style.opacity = "1";
      });
      pt.addEventListener("mouseleave", () => { tip.style.opacity = "0"; });
    });
  }

  function showDetail(id, sessionId) {
    renderDetail(id, sessionId);
    detail.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  render();

  // ── Tabs ──────────────────────────────────────────────────────────────
  const tabOverviewBtn = document.getElementById("tabOverviewBtn");
  const tabCalendarBtn = document.getElementById("tabCalendarBtn");
  const viewOverview = document.getElementById("viewOverview");
  const viewCalendar = document.getElementById("viewCalendar");

  const tabHrvBtn = document.getElementById("tabHrvBtn");
  const viewHrv = document.getElementById("viewHrv");

  function activateTab(name) {
    const tabs = {
      overview: [tabOverviewBtn, viewOverview],
      calendar: [tabCalendarBtn, viewCalendar],
      hrv: [tabHrvBtn, viewHrv],
    };
    for (const [key, [btn, view]] of Object.entries(tabs)) {
      const on = key === name;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-selected", String(on));
      view.classList.toggle("active", on);
    }
    if (name === "calendar") renderCalendar();
    if (name === "hrv") renderHrvGrid();
  }
  tabOverviewBtn.addEventListener("click", () => activateTab("overview"));
  tabCalendarBtn.addEventListener("click", () => activateTab("calendar"));
  tabHrvBtn.addEventListener("click", () => activateTab("hrv"));

  /// One row per athlete, one square per day over fourteen days.
  ///
  /// The view no card can give. A drift reads as a band that darkens or
  /// lightens across the week, and **a run of empty squares says an athlete
  /// stopped testing** — often the first sign of something, and invisible
  /// everywhere else. Squares are never interpolated for that reason.
  /// The morning banner: **it names them.**
  ///
  /// "1 motif de fatigue" without a name makes the coach open every card to
  /// find who, which is the opposite of what a banner is for.
  const HRV_THRESHOLD_FIELDS = [
    ["energyCollapseLFSupine",        "Effondrement · LF couché <"],
    ["energyCollapseHFSupine",        "Effondrement · HF couché <"],
    ["energyCollapseHFStanding",      "Effondrement · HF debout <"],
    ["energyCollapseLFStanding",      "Effondrement · LF debout <"],
    ["acuteStressLFSupine",           "Stress aigu · LF couché >"],
    ["acuteStressLFStanding",         "Stress aigu · LF debout <"],
    ["activationBrakeHFSupine",       "Frein · HF couché <"],
    ["activationBrakeHFStanding",     "Frein · HF debout >"],
    ["extremeFatigueHFSupine",        "Fatigue extrême · HF couché >"],
    ["peripheralRegulationLFStanding","Régulation périph. · LF debout <"],
    ["smallBasePower",                "Base faible en dessous de (ms²)"],
  ];

  function thresholdEditor(a) {
    const current = Object.assign({}, HRV_DEFAULTS, a.hrvThresholds || {});
    const rows = HRV_THRESHOLD_FIELDS.map(([key, label]) => `
      <div class="thr-row">
        <label for="thr-${key}">${t(label)}</label>
        <input id="thr-${key}" class="thr-input" data-key="${key}" type="number" step="1" value="${current[key]}">
      </div>`).join("");
    return `<div class="thr-grid" data-athlete="${esc(a.id)}">${rows}</div>
      <div class="thr-actions">
        <button class="nav-btn thr-save" style="width:auto">${t("Enregistrer les seuils")}</button>
        <button class="link-btn thr-reset">${t("Revenir aux valeurs par défaut")}</button>
        <span class="thr-status chart-note${a.hrvThresholdsError ? " invite-warn" : ""}">${
          a.hrvThresholdsError
            ? esc(t("Seuils illisibles — les valeurs affichées sont celles par défaut. ") + a.hrvThresholdsError)
            : ""}</span>
      </div>`;
  }

  /// Writes only what the coach actually moved away from the defaults.
  ///
  /// The drawer used to write every field shown, so a single save froze that
  /// day's defaults into overrides — and a later recalibration of the defaults
  /// then changed nothing for that athlete, silently. That is exactly what kept
  /// Benoît on the workbook's thresholds after the Schmitt (2015) recalibration
  /// of 2026-09-10. With nothing moved, the document is deleted rather than
  /// left holding an empty map: no document means "defaults", on the dashboard
  /// and on the phone alike.
  async function saveThresholds(athleteId, values, status) {
    const overrides = {};
    for (const [key, value] of Object.entries(values)) {
      if (key in HRV_DEFAULTS && Math.abs(value - HRV_DEFAULTS[key]) > 1e-9) overrides[key] = value;
    }
    const ref = doc(firestore, "athletes", athleteId, "config", "hrvThresholds");
    try {
      if (Object.keys(overrides).length) {
        await setDoc(ref, overrides);
        if (status) status.textContent = t("Seuils enregistrés.");
      } else {
        await deleteDoc(ref);
        if (status) status.textContent = t("Valeurs par défaut rétablies — aucun seuil propre à cet athlète.");
      }
    } catch (e) {
      if (status) status.textContent = t("Échec de l'enregistrement : ") + e.message;
    }
  }

  function renderMorningBanner() {
    const el = document.getElementById("morningBanner");
    if (!el) return;
    const flagged = athletes
      .map(a => ({ athlete: a, verdict: hrvVerdict(a) }))
      .filter(x => x.verdict && x.verdict.pattern);

    if (!flagged.length) { el.innerHTML = ""; return; }

    const items = flagged.map(({ athlete, verdict }) => `
      <li><strong>${esc(athlete.name)}</strong> — ${esc(verdict.pattern.reading)}
        <span class="banner-code">${esc(verdict.pattern.id)}</span>
        ${verdict.smallBase ? `<span class="banner-warn">${t("base faible")}</span>` : ""}</li>`).join("");

    el.innerHTML = `<div class="morning-banner">
      <p class="banner-head">${flagged.length} ${flagged.length > 1 ? t("motifs de fatigue") : t("motif de fatigue")}</p>
      <ul>${items}</ul>
      <p class="banner-note">${t("Ces lectures décrivent un état physiologique. Elles ne disent pas quelle séance faire — ça dépend du plan de la semaine, de l'eau et de ce que ressent l'athlète.")}</p>
    </div>`;
  }

  const HRV_STATE_LABEL = {
    ok: "aucun motif", watch: "à surveiller",
    alert: "motif de fatigue", none: "pas de test",
    partial: "test incomplet — une position manque",
  };

  /// Which test the drawer is showing: whichever square was clicked, and the
  /// most recent until one is. Held per athlete so a re-render — the dashboard
  /// redraws on every snapshot — does not throw the coach back to today.
  const hrvSelectedTest = new Map();   // athlete id -> test id

  /// Which morning the drawer is showing, and from which of the two lists.
  ///
  /// By id, not by index: a test deleted from the phone shifts every index
  /// after it, and a stale index would silently open a different morning.
  function hrvShown(a) {
    const tests = a.hrv || [];
    const wanted = hrvSelectedTest.get(a.id);
    if (wanted) {
      const i = tests.findIndex(x => x.id === wanted);
      if (i >= 0) return { kind: "full", index: i, test: tests[i] };
      const partial = (a.hrvPartial || []).find(x => x.id === wanted);
      if (partial) return { kind: "partial", index: -1, test: partial };
    }
    const last = tests.length - 1;
    if (last >= 0) return { kind: "full", index: last, test: tests[last] };
    // Only failed mornings so far: show the most recent of those rather than
    // an empty drawer.
    const fallback = (a.hrvPartial || []).slice(-1)[0];
    return fallback
      ? { kind: "partial", index: -1, test: fallback }
      : { kind: "none", index: -1, test: null };
  }

  /// The squad over a fortnight: one row per athlete, one square per morning,
  /// and under each row a drawer holding that athlete's four coach panels.
  ///
  /// The square carries the *state*, not the rMSSD. An intensity ramp asked
  /// the coach to read a value and decide; a colour answers the question they
  /// actually arrive with at eight in the morning — who needs a word before
  /// the session. A drift then reads as a band that darkens, and a run of
  /// dashes says an athlete has stopped testing, which is often the first sign
  /// of anything and is invisible on every other screen.
  ///
  /// The drawer is where the numbers live. Everything in it is for the coach:
  /// the athlete's own screen stays thin on purpose, because reading a
  /// spectrum against thresholds is an expertise, and half-read it is worse
  /// than not shown.
  function renderHrvGrid() {
    const grid = document.getElementById("hrvGrid");
    // Partial tests count as tests here. An athlete whose only mornings failed
    // would otherwise be missing from the table entirely, which is the same
    // silence the hatched square exists to break.
    const withTests = athletes.filter(a => (a.hrv || []).length || (a.hrvPartial || []).length);
    if (!withTests.length) {
      grid.innerHTML = `<p class="empty-note">${t("Aucun test HRV synchronisé pour l'instant.")}</p>`;
      return;
    }

    // A shared span of days, so the columns line up between athletes.
    const days = [];
    const today = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      days.push(isoDate(d));
    }

    const head = `<tr><th class="name">${t("Athlète")}</th>` +
      days.map((iso, i) => {
        const back = days.length - 1 - i;
        return `<th title="${esc(shortDate(iso))}">${back === 0 ? t("auj.") : "−" + back}</th>`;
      }).join("") + `<th></th></tr>`;

    const rows = withTests.map(a => {
      const indexByDay = new Map((a.hrv || []).map((x, i) => [x.date, i]));
      // How much each position actually captured, so the square says what was
      // lost rather than only that something was. It is the one fact worth
      // having about a failed morning: two minutes then nothing is a stream
      // that was cut, a series that thins out is a strap losing contact.
      const partialByDay = new Map((a.hrvPartial || []).map(x => {
        const secs = arr => (arr || []).reduce((n, v) => n + v, 0) / 1000;
        const span = s => s < 1 ? t("rien") : Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
        return [x.date, `${t("couché")} ${span(secs(x.supineRR))} · ${t("debout")} ${span(secs(x.standingRR))}`];
      }));
      const partialById = new Map((a.hrvPartial || []).map(x => [x.date, x]));
      const shown = hrvShown(a);
      const cells = days.map(iso => {
        const index = indexByDay.get(iso);
        const partial = index === undefined ? partialById.get(iso) : null;
        const state = partial ? "partial" : index === undefined ? "none" : hrvStateAt(a, index);
        const test = index === undefined ? partial : a.hrv[index];
        const tip = index !== undefined
          ? `${shortDate(iso)} — ${t(HRV_STATE_LABEL[state])} · ${hrvPillLabel(test)}`
          : `${shortDate(iso)} — ${t(HRV_STATE_LABEL[partial ? "partial" : "none"])}${
              partial ? " · " + partialByDay.get(iso) : ""}`;
        // A failed morning opens too. There is no reading to show — no
        // median, no delta, no cascade — but there are the figures of the
        // position that did work and the curve of what was captured, and
        // that curve is the whole record of the failure.
        const sel = test && shown.test && test.id === shown.test.id && hrvOpenAthletes.has(a.id);
        return `<td><span class="hrv-d ${state}${sel ? " sel" : ""}" title="${esc(tip)}"
          ${test ? `data-hrv-open="${esc(a.id)}" data-hrv-test="${esc(test.id)}" role="button" tabindex="0"
            aria-label="${esc(t("Ouvrir le test du") + " " + shortDate(iso))}"` : ""}></span></td>`;
      }).join("");

      const open = hrvOpenAthletes.has(a.id);
      const last = shown.index;
      const panels = !open ? "" : `
        <tr class="hrv-drawer-row"><td colspan="${days.length + 2}">
          ${(() => {
            if (!shown.test) return "";
            const latest = shown.kind === "full" && last === (a.hrv || []).length - 1;
            // Named, because every panel below is about one morning and the
            // squad strip above shows fourteen. Without this the drawer looks
            // the same whichever square was clicked.
            return `<p class="hrv-shown">${t("Test du")} <strong>${esc(shortDate(shown.test.date))}</strong>${
              shown.kind === "partial" ? ` · ${t("incomplet")}` : ""}${
              latest ? ` · ${t("le plus récent")}` : `
              <button class="link-btn" data-hrv-latest="${esc(a.id)}">${t("revenir au dernier")}</button>`}</p>`;
          })()}
          <div class="hrv-panels">
            ${shown.kind === "partial" ? `
              ${hrvPartialHTML(shown.test)}
              ${hrvRateHTML(a, shown.test)}
              ${hrvRemarksHTML(a, shown.test)}
            ` : `
              ${hrvBilanHTML(a, last) || `<p class="chart-note">${t("Pas encore de référence : il faut au moins un test antérieur pour calculer les écarts.")}</p>`}
              ${hrvMotifsHTML(a, last)}
              ${hrvRadarPanelHTML(a, last)}
              ${hrvRateHTML(a, shown.test)}
              ${hrvSuiviHTML(a, last)}
              ${hrvRemarksHTML(a, shown.test)}
            `}
          </div>
          <!-- Last, and under the panels it governs: these eleven numbers
               decide what the Motifs panel says, so they belong beneath it
               rather than on a screen that never shows the cascade at all. -->
          <details class="drawer" style="margin-top:1rem">
            <summary>${t("Seuils de fatigue")}</summary>
            <div class="drawer-body">
              <p class="chart-note" style="margin:0 0 .8rem">${t("Les seuils de Schmitt, en pourcentage de variation contre la référence. Réglables par athlète : ce sont des repères calibrés sur une population, et un athlète peut en avoir besoin d'autres. Les valeurs par défaut sont celles du classeur d'origine.")}</p>
              ${thresholdEditor(a)}
            </div>
          </details>
        </td></tr>`;

      return `<tr class="hrv-athlete ${open ? "open" : ""}" data-hrv-row="${esc(a.id)}">
          <td class="name">${esc(a.name)}</td>${cells}
          <td class="toggle"><button class="hrv-toggle" data-hrv-toggle="${esc(a.id)}"
            aria-expanded="${open}">${open ? t("Fermer") : t("Détail")}</button></td>
        </tr>${panels}`;
    }).join("");

    const legend = ["ok", "watch", "alert", "none"].map(state =>
      `<span class="hrv-key"><i class="hrv-d ${state}"></i>${t(HRV_STATE_LABEL[state])}</span>`
    ).join("");

    grid.innerHTML = `
      <div class="hrv-squad"><table>${head}${rows}</table></div>
      <div class="hrv-legend">${legend}</div>
      <p class="chart-note">${t("Quatorze matins. « À surveiller » n'est pas un motif de Schmitt : c'est une lecture dont le calcul se méfie — spectre peu fiable, ou écart calculé sur une base trop faible pour qu'un pourcentage veuille dire grand-chose.")}</p>`;

    grid.querySelectorAll("[data-hrv-toggle]").forEach(btn => btn.addEventListener("click", () => {
      const id = btn.dataset.hrvToggle;
      if (hrvOpenAthletes.has(id)) {
        hrvOpenAthletes.delete(id);
        // Closed means closed: re-opening from the button shows today, not
        // whichever old morning was last looked at.
        hrvSelectedTest.delete(id);
        hrvZoom.delete(id);
      } else {
        hrvOpenAthletes.add(id);
      }
      renderHrvGrid();
    }));
    grid.querySelectorAll("[data-hrv-position]").forEach(btn => btn.addEventListener("click", () => {
      hrvPositionChoice.set(btn.dataset.athlete, btn.dataset.hrvPosition);
      renderHrvGrid();
    }));
    grid.querySelectorAll("[data-hrv-series]").forEach(btn => btn.addEventListener("click", () => {
      hrvSeriesChoice.set(btn.dataset.athlete, btn.dataset.hrvSeries);
      renderHrvGrid();
    }));

    grid.querySelectorAll("[data-hrv-open]").forEach(cell => {
      const open = () => {
        const id = cell.dataset.hrvOpen;
        hrvSelectedTest.set(id, cell.dataset.hrvTest);
        hrvOpenAthletes.add(id);
        // A zoom belongs to the curve it was drawn on; carried over it lands
        // on a stretch of another morning that means nothing.
        hrvZoom.delete(id);
        renderHrvGrid();
      };
      cell.addEventListener("click", open);
      cell.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    });

    grid.querySelectorAll("[data-hrv-latest]").forEach(btn => btn.addEventListener("click", () => {
      hrvSelectedTest.delete(btn.dataset.hrvLatest);
      hrvZoom.delete(btn.dataset.hrvLatest);
      renderHrvGrid();
    }));

    grid.querySelectorAll(".hr-chart").forEach(wireRateChart);

    grid.querySelectorAll("[data-hr-reset]").forEach(btn => btn.addEventListener("click", () => {
      hrvZoom.delete(btn.dataset.hrReset);
      renderHrvGrid();
    }));

    // Same scoping lesson as the thresholds below: one textarea per athlete,
    // and a page-wide selector would file every remark against the first one.
    grid.querySelectorAll(".note-input").forEach(input => {
      const panel = input.closest(".hrv-panel");
      const status = panel.querySelector(".note-status");
      panel.querySelector(".note-save")?.addEventListener("click", async () => {
        try {
          await setDoc(
            doc(firestore, "athletes", input.dataset.noteAthlete, "config", "coachNotes"),
            { [input.dataset.noteTest]: input.value.trim() },
            { merge: true });
          status.textContent = t("Enregistré.");
        } catch (e) {
          status.textContent = t("Échec de l'enregistrement : ") + e.message;
        }
      });
    });

    // Scoped to their own editor rather than to the page: several athletes'
    // drawers can be open at once, and a lone getElementById would have every
    // Save button write the first athlete's numbers.
    grid.querySelectorAll(".thr-grid").forEach(editor => {
      const card = editor.closest(".drawer-body");
      card.querySelector(".thr-save")?.addEventListener("click", () => {
        const values = {};
        editor.querySelectorAll(".thr-input").forEach(input => {
          const n = parseFloat(input.value);
          if (!Number.isNaN(n)) values[input.dataset.key] = n;
        });
        saveThresholds(editor.dataset.athlete, values, card.querySelector(".thr-status"));
      });
      // Resetting used to change the inputs on screen and write nothing, so a
      // coach who clicked it and walked away kept the old overrides. It now
      // clears the document, which is what "back to defaults" means.
      card.querySelector(".thr-reset")?.addEventListener("click", () => {
        editor.querySelectorAll(".thr-input").forEach(input => {
          input.value = HRV_DEFAULTS[input.dataset.key];
        });
        saveThresholds(editor.dataset.athlete, {}, card.querySelector(".thr-status"));
      });
    });
  }

  // ── Session filter (toutes / entraînement / tests) ──────────────────────
  document.getElementById("sessionModeSeg").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById("sessionModeSeg").querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      sessionFilterMode = btn.dataset.mode;
      athletes.forEach(deriveAthlete);
      onDataChanged();
      if (openDetailId) renderDetail(openDetailId, openDetailSession);
    });
  });

  // ── Calendar state ────────────────────────────────────────────────────
  // The week first, and by default: it is the unit a coach plans and reads a
  // squad in, and it is the only span where a session shows its load bar
  // rather than a coloured initial.
  let calMode = "week";
  // Jour mis en avant à l'arrivée depuis un graphique de charge. Effacé dès
  // que l'entraîneur navigue : la surbrillance répond à un clic précis, elle
  // ne suit pas la promenade qui vient après.
  let calFocusIso = null;
  let calCursor = new Date();

  const calFilters = document.getElementById("calFilters");

  function renderCalFilters() {
    const renderable = renderableAthletes();
    renderable.forEach(a => {
      if (!knownAthleteIds.has(a.id)) {
        knownAthleteIds.add(a.id);
        activeAthletes.add(a.id); // new athletes default to visible, matching the original behavior
      }
    });
    const someHidden = renderable.some(a => !activeAthletes.has(a.id));
    calFilters.innerHTML = renderable.map(a => `
      <span class="chip ${activeAthletes.has(a.id) ? "" : "off"}" data-id="${a.id}" tabindex="0" role="button" aria-pressed="${activeAthletes.has(a.id)}">
        <span class="dot" style="background:${a.color}"></span>${a.name.split(" ")[0]}
      </span>`).join("")
      + (someHidden ? `<span class="chip chip-all" tabindex="0" role="button">${t("Tous")}</span>` : "");

    const allChip = calFilters.querySelector(".chip-all");
    if (allChip) {
      const showAll = () => {
        renderable.forEach(a => activeAthletes.add(a.id));
        renderCalFilters();
        renderCalendar();
      };
      allChip.addEventListener("click", showAll);
      allChip.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showAll(); }
      });
    }

    calFilters.querySelectorAll(".chip:not(.chip-all)").forEach(chip => {
      const toggle = () => {
        const id = chip.dataset.id;
        if (activeAthletes.has(id)) activeAthletes.delete(id); else activeAthletes.add(id);
        // Redessiner la rangée entière, et pas seulement la pastille cliquée :
        // c'est ce qui fait apparaître et disparaître « Tous » au bon moment.
        renderCalFilters();
        renderCalendar();
      };
      chip.addEventListener("click", toggle);
      chip.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
  }

  /// Ouvre le calendrier sur la semaine d'un jour précis, depuis une colonne
  /// d'un graphique de charge. La semaine plutôt que le mois : c'est là que
  /// chaque séance de la journée se lit en détail, et c'est ce qu'on vient
  /// chercher après avoir cliqué une barre.
  ///
  /// Le filtre d'athlètes n'est **pas** touché. On arrive depuis la fiche d'un
  /// athlète, donc le restreindre à lui serait tentant — mais ce filtre est un
  /// réglage que l'entraîneur a posé, et le changer sous ses pieds sans qu'il
  /// l'ait demandé est plus déroutant qu'utile.
  /// Opens mornings in the HRV tab, each under its athlete: one from the bars
  /// on an athlete's page, everyone who tested that day from the calendar.
  function openHrvOn(picks) {
    picks.forEach(([athleteId, testId]) => {
      hrvSelectedTest.set(athleteId, testId);
      hrvOpenAthletes.add(athleteId);
      // A zoom belongs to the curve it was drawn on — see renderHrvGrid.
      hrvZoom.delete(athleteId);
    });
    activateTab("hrv");
    const first = picks.length ? picks[0][0] : null;
    const row = [...document.querySelectorAll("#hrvGrid [data-hrv-row]")]
      .find(r => r.dataset.hrvRow === first);
    (row || document.getElementById("viewHrv")).scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /// Everyone who tested on a calendar day, each on that day's test — the same
  /// test the square for that day opens in the HRV tab when there were several.
  function openHrvDay(iso) {
    openHrvOn(hrvOn(iso).map(a => [a.id, a.hrv.filter(x => x.date === iso).pop().id]));
  }

  function openCalendarOn(iso, athleteId) {
    // Filtrer sur l'athlète d'origine : à dix athlètes dans l'équipe, une
    // semaine non filtrée est illisible, et on arrive justement de la fiche
    // d'un seul. Le retour tient en un clic grâce à la pastille « Tous »,
    // qui n'apparaît que lorsque quelqu'un est masqué — sans elle, revenir
    // coûterait autant de clics que d'athlètes.
    if (athleteId) {
      // Les marquer connus d'abord : renderCalFilters ajoute tout athlète
      // qu'il n'a jamais vu, et il n'en connaît aucun tant qu'il n'a pas
      // tourné une fois — sans quoi il rendrait le filtre aussitôt défait.
      renderableAthletes().forEach(a => knownAthleteIds.add(a.id));
      activeAthletes.clear();
      activeAthletes.add(athleteId);
      // Et redessiner les pastilles : renderCalendar ne les touche pas, elles
      // ne sont refaites que sur arrivée de données. Sans cet appel la grille
      // se filtrait pendant que les pastilles continuaient d'afficher toute
      // l'équipe cochée — un état faux, et aucun moyen de revenir puisque
      // « Tous » n'apparaissait pas non plus. Trouvé en testant, pas en
      // relisant.
      renderCalFilters();
    }
    calFocusIso = iso;
    calMode = "week";
    calCursor = new Date(iso + "T12:00:00");
    document.getElementById("calModeSeg").querySelectorAll("button")
      .forEach(b => b.classList.toggle("active", b.dataset.mode === "week"));
    activateTab("calendar");
    document.getElementById("viewCalendar")
      .scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("calModeSeg").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById("calModeSeg").querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      calMode = btn.dataset.mode;
      calFocusIso = null;
      renderCalendar();
    });
  });
  document.getElementById("calPrev").addEventListener("click", () => { shiftCursor(-1); calFocusIso = null; renderCalendar(); });
  document.getElementById("calNext").addEventListener("click", () => { shiftCursor(1); calFocusIso = null; renderCalendar(); });

  function shiftCursor(dir) {
    if (calMode === "month") calCursor.setMonth(calCursor.getMonth() + dir);
    else calCursor.setDate(calCursor.getDate() + dir * 7);
    calCursor = new Date(calCursor);
  }

  // Built from the locale rather than hard-coded, so the calendar reads in the
  // reader's language. Monday-first either way — that is the training week.
  const DOW = (() => {
    const f = new Intl.DateTimeFormat(LOCALE, { weekday: "short" });
    return [...Array(7)].map((_, i) => {
      const d = new Date(Date.UTC(2024, 0, 1 + i)); // 2024-01-01 was a Monday
      const s = f.format(d);
      return s.charAt(0).toUpperCase() + s.slice(1).replace(/\.$/, "");
    });
  })();
  const MONTH_NAMES = (() => {
    const f = new Intl.DateTimeFormat(LOCALE, { month: "long" });
    return [...Array(12)].map((_, m) => {
      const s = f.format(new Date(Date.UTC(2024, m, 15)));
      return s.charAt(0).toUpperCase() + s.slice(1);
    });
  })();

  function isoDate(d) {
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  /// Every session on a day, athlete by athlete, earliest first.
  ///
  /// This used to `find` one session per athlete per day, so an athlete who
  /// trained twice showed once and the rest of the day was invisible — with
  /// nothing to say so. Ordering is by start time rather than by document id,
  /// which Firestore returns in an order of its own.
  function sessionsOn(iso) {
    return athletes
      .filter(a => activeAthletes.has(a.id))
      .flatMap(a => a.sessions
        .filter(s => s.date === iso && matchesFilterMode(s))
        .map(s => ({ a, s })))
      .sort((x, y) => (x.s.startedAt || 0) - (y.s.startedAt || 0));
  }
  /// Athletes who tested on a given day. The pill sits over the session
  /// colours so one square can carry both, and the eye compares yesterday's
  /// load with this morning's reading without changing screen.
  function hrvOn(iso) {
    return athletes.filter(a => (a.hrv || []).some(t => t.date === iso));
  }
  function hrvPill(iso) {
    const who = hrvOn(iso);
    if (!who.length) return "";
    return `<span class="hrv-pill" data-tip="${esc(who.map(a => a.name).join(", "))}" data-hrv-day="${iso}"
      role="button" tabindex="0" aria-label="${esc(t("Ouvrir le test du") + " " + shortDate(iso))}">♥ ${who.length}</span>`;
  }

  function mechPctLabel(mech) {
    const total = mech.reduce((x,y) => x+y, 0) || 1;
    const pcts = mech.map(v => Math.round(v/total*100));
    return `Z1 ${pcts[0]}% · Z2 ${pcts[1]}% · Z3 ${pcts[2]}%`;
  }
  function hrPctLabel(hr) {
    const total = hr.reduce((x,y) => x+y, 0) || 1;
    const pcts = hr.map(v => Math.round(v/total*100));
    return `I1 ${pcts[0]}% · I2 ${pcts[1]}% · I3 ${pcts[2]}%`;
  }
  // A PPG session carries no mechanical figures at all — the app does not
  // produce them, because chest acceleration while running is stride and a
  // stride peak would outrank anything done on the water. So wherever a
  // mechanical bar would go, show the cardiac one.
  function loadBars(s) {
    return s.isConditioning
      ? { values: s.hr, colors: ["var(--i1)","var(--i2)","var(--i3)"], label: hrPctLabel(s.hr) }
      : { values: s.mech, colors: ["var(--z1)","var(--z2)","var(--z3)"], label: mechPctLabel(s.mech) };
  }

  /// A period total reads better in hours than in minutes and seconds: a week
  /// of paddling is "4 h 12", not "252:07".
  function fmtLoad(sec) {
    const m = Math.round(sec / 60);
    return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0");
  }

  /// Time per zone summed over whatever period the calendar is showing — the
  /// week in week view, the month in month view. Figures only, no bars: this
  /// panel is read for what an athlete actually did, and a number says it
  /// where a bar approximates it.
  ///
  /// **Cardio counts every session, mechanical only the paddling ones.** That
  /// asymmetry is deliberate and already what a session page says: a
  /// conditioning session produces no mechanical figure at all, by
  /// construction (invariant 14 — a running stride would otherwise write the
  /// athlete's zones), while its heart rate is a real cost and counts. So an
  /// athlete who only ran this week shows cardio and no mechanical, which is
  /// the truth rather than a zero.
  function renderCalendarTotals(days) {
    const panel = document.getElementById("calTotals");
    if (!panel) return;
    const inPeriod = new Set(days.filter(d => !d.out).map(d => isoDate(d.date)));
    const add = (acc, v) => [acc[0] + v[0], acc[1] + v[1], acc[2] + v[2]];
    const sum = v => v[0] + v[1] + v[2];

    let hasConditioning = false;
    const rows = athletes
      .filter(a => activeAthletes.has(a.id))
      .map(a => {
        const list = (a.sessions || []).filter(x => inPeriod.has(x.date) && matchesFilterMode(x));
        if (list.some(x => x.isConditioning)) hasConditioning = true;
        return {
          a,
          count: list.length,
          hr: list.reduce((acc, x) => add(acc, x.hr), [0, 0, 0]),
          mech: list.filter(x => !x.isConditioning).reduce((acc, x) => add(acc, x.mech), [0, 0, 0])
        };
      })
      .filter(r => r.count > 0);

    const title = t(calMode === "week" ? "Total de la semaine" : "Total du mois");
    if (!rows.length) {
      panel.innerHTML = `<h3>${title} — ${t("Temps par zone")}</h3>
        <p class="empty-note">${t("Aucune séance sur cette période.")}</p>`;
      return;
    }

    const line = (kind, values, prefix) => `<div class="cal-total-line">
      <span class="kind">${kind}</span>
      <span class="vals">${values.map((v, i) => `${prefix}${i + 1} ${fmtLoad(v)}`).join(" · ")}</span>
    </div>`;

    const body = rows.map(r => `<div class="cal-total-row">
        <div class="cal-total-head">
          <span class="a-chip" style="background:${r.a.color}">${r.a.initial}</span>
          <span class="who">${esc(r.a.name)}</span>
          <span class="sum">${r.count} ${r.count > 1 ? t("séances") : t("séance")}</span>
        </div>
        ${line(t("Cardio"), r.hr, "I")}
        ${sum(r.mech) > 0
          ? line(t("Mécanique"), r.mech, "Z")
          : `<div class="cal-total-line"><span class="kind">${t("Mécanique")}</span><span class="vals">${t("PPG seulement")}</span></div>`}
      </div>`).join("");

    panel.innerHTML = `<h3>${title} — ${t("Temps par zone")}</h3>${body}
      ${hasConditioning ? `<p class="chart-note">${t("Les séances PPG comptent dans le cardio mais pas dans le mécanique : elles n'en produisent pas.")}</p>` : ""}`;
  }

  function renderCalendar() {
    const grid = document.getElementById("calGrid");
    const label = document.getElementById("calLabel");
    grid.className = "cal-grid" + (calMode === "week" ? " week" : "");

    let days = [];
    if (calMode === "month") {
      const year = calCursor.getFullYear(), month = calCursor.getMonth();
      label.textContent = MONTH_NAMES[month] + " " + year;
      const first = new Date(year, month, 1);
      const startOffset = (first.getDay() + 6) % 7; // Monday-first
      const gridStart = new Date(year, month, 1 - startOffset);
      for (let i = 0; i < 42; i++) {
        const d = new Date(gridStart);
        d.setDate(gridStart.getDate() + i);
        days.push({ date: d, out: d.getMonth() !== month });
      }
    } else {
      const startOffset = (calCursor.getDay() + 6) % 7;
      const weekStart = new Date(calCursor);
      weekStart.setDate(calCursor.getDate() - startOffset);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
      const fmt = d => d.getDate() + " " + MONTH_NAMES[d.getMonth()].slice(0,3);
      label.textContent = fmt(weekStart) + " – " + fmt(weekEnd);
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate() + i);
        days.push({ date: d, out: false });
      }
    }

    const dow = DOW.map(d => `<div class="cal-dow">${d}</div>`).join("");
    const cells = days.map(({date, out}) => {
      const iso = isoDate(date);
      const hits = sessionsOn(iso);
      const isToday = iso === isoDate(new Date());
      let inner;
      if (calMode === "month") {
        const chips = hits.map(({a,s}) => {
          const tipLabel = esc(a.name + " " + (s.startedAtLabel || "") + (s.name ? " · " + s.name : "") + " — " + s.duration + " min · RPE " + rpeLabel(s.rpe) + (s.isConditioning ? t(" · PPG") + " · " : " · ") + loadBars(s).label);
          return `<span class="a-chip open-session" style="background:${a.color}" data-tip="${tipLabel}" data-id="${esc(a.id)}" data-session="${esc(s.id)}" role="button" tabindex="0" aria-label="${t("Voir la séance de")} ${esc(a.name)}">${a.initial}</span>`;
        }).join("");
        inner = `<div class="day-num">${date.getDate()}${hrvPill(iso)}</div><div class="day-chips">${chips}</div>`;
      } else {
        const rows = hits.map(({a,s}) => {
          const load = loadBars(s);
          const total = load.values.reduce((x,y)=>x+y,0) || 1;
          const bar = load.values.map((v,i) => `<span style="width:${(v/total*100).toFixed(1)}%;background:${load.colors[i]}"></span>`).join("");
          const tipLabel = esc(a.name + " " + (s.startedAtLabel || "") + (s.name ? " · " + s.name : "") + " — " + s.duration + " min · RPE " + rpeLabel(s.rpe) + (s.isConditioning ? t(" · PPG") + " · " : " · ") + load.label);
          return `<div class="week-chip open-session" data-tip="${tipLabel}" data-id="${esc(a.id)}" data-session="${esc(s.id)}" role="button" tabindex="0" aria-label="${t("Voir la séance de")} ${esc(a.name)}">
            <span class="a-chip" style="background:${a.color}">${a.initial}</span>
            <span class="mini-bar">${bar}</span>
          </div>`;
        }).join("");
        inner = `<div class="day-num">${date.getDate()}${hrvPill(iso)}</div><div class="day-chips">${rows || '<span class="empty-note">—</span>'}</div>`;
      }
      return `<div class="cal-day ${out?"out":""} ${isToday?"today":""} ${iso===calFocusIso?"focus":""}">${inner}</div>`;
    }).join("");

    grid.innerHTML = dow + cells;
    renderCalendarTotals(days);

    const calWrap = document.getElementById("calGridWrap");
    let tip = document.getElementById("calTip");
    if (!tip) {
      tip = document.createElement("div");
      tip.className = "tooltip";
      tip.id = "calTip";
      calWrap.appendChild(tip);
    }
    grid.querySelectorAll("[data-tip]").forEach(el => {
      el.addEventListener("mouseenter", () => {
        const wrap = calWrap.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        tip.textContent = el.dataset.tip;
        tip.style.left = (r.left + r.width/2 - wrap.left) + "px";
        tip.style.top = (r.top - wrap.top) + "px";
        tip.style.opacity = "1";
      });
      el.addEventListener("mouseleave", () => { tip.style.opacity = "0"; });
    });

    // The detail panel lives in the overview view, so opening a session from
    // the calendar switches back to it rather than rendering somewhere hidden.
    grid.querySelectorAll(".open-session").forEach(el => {
      const open = () => {
        tip.style.opacity = "0";
        activateTab("overview");
        showDetail(el.dataset.id, el.dataset.session);
      };
      el.addEventListener("click", open);
      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    });

    // The heart opens the tests themselves, in their own tab.
    grid.querySelectorAll("[data-hrv-day]").forEach(el => {
      const open = () => {
        tip.style.opacity = "0";
        openHrvDay(el.dataset.hrvDay);
      };
      el.addEventListener("click", open);
      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    });
  }
</script>
</body>
</html>
