<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The whole dashboard is this one file, so a cached copy is a cached
     *application*: a fix pushed an hour ago can still be absent from the
     screen, and the symptoms look exactly like the bug that was fixed. Twice
     now that has cost a diagnosis. Revalidate on every load — the file is
     180 KB and the tab is opened a few times a day. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>MoveLoad Coach — suivi des athlètes</title>
<style>
  :root {
    --bg: #F5F6F7;
    --card-bg: #FFFFFF;
    --card-bg-hover: #FBFCFC;
    --border: #E2E5E8;
    --border-strong: #C7CCD1;
    --ink: #1C232B;
    --ink-soft: #5B6572;
    --ink-muted: #8A93A0;
    --accent: #2E6F72;
    --accent-soft: #E7F0F0;
    --warn-bg: #FCEEE9;
    --warn-border: #E8B79A;
    --warn-ink: #8A4A1F;

    --i1: #007AFF;
    --i2: #FF9500;
    --i3: #FF3B30;
    --z1: #1E8449;
    --z2: #B8860B;
    --z3: #AF52DE;

    --a-lea: #2a78d6;
    --a-karim: #eb6834;
    --a-sofia: #1baf7a;
    --a-tom: #eda100;
    --a-nina: #e87ba4;
    --a-hugo: #008300;
  }
  :root[data-theme="dark"] {
    --bg: #12161C;
    --card-bg: #181D24;
    --card-bg-hover: #1D232B;
    --border: #2A313A;
    --border-strong: #3A424D;
    --ink: #ECEDEF;
    --ink-soft: #98A1AC;
    --ink-muted: #6E7683;
    --accent: #5FB4B0;
    --accent-soft: #1A2B2A;
    --warn-bg: #2B2019;
    --warn-border: #6B4326;
    --warn-ink: #E8B79A;

    --i2: #9B7D14;

    --a-lea: #3987e5;
    --a-karim: #d95926;
    --a-sofia: #199e70;
    --a-tom: #c98500;
    --a-nina: #d55181;
    --a-hugo: #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161C;
      --card-bg: #181D24;
      --card-bg-hover: #1D232B;
      --border: #2A313A;
      --border-strong: #3A424D;
      --ink: #ECEDEF;
      --ink-soft: #98A1AC;
      --ink-muted: #6E7683;
      --accent: #5FB4B0;
      --accent-soft: #1A2B2A;
      --warn-bg: #2B2019;
      --warn-border: #6B4326;
      --warn-ink: #E8B79A;
      --i2: #9B7D14;
      --a-lea: #3987e5;
      --a-karim: #d95926;
      --a-sofia: #199e70;
      --a-tom: #c98500;
      --a-nina: #d55181;
      --a-hugo: #008300;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .dash {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 1.75rem 1.25rem 3rem;
    max-width: 1180px;
    margin: 0 auto;
  }
  .dash * { font-variant-numeric: tabular-nums; }

  .top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .top-meta { font-size: 13px; color: var(--ink-soft); }
  /* The team's name reads as a name, not as another status line. */
  #teamName { font-weight: 600; color: var(--ink); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.2rem;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .card:hover, .card:focus-visible { border-color: var(--border-strong); background: var(--card-bg-hover); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .athlete-name { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
  .athlete-meta { font-size: 12.5px; color: var(--ink-soft); }
  .badge {
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em;
    padding: 0.2rem 0.5rem; border-radius: 999px; white-space: nowrap;
    background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-border);
  }

  .bar-row { display: flex; flex-direction: column; gap: 3px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-muted); }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); }
  .bar > span { height: 100%; }
  .bar > span + span { border-left: 2px solid var(--card-bg); }

  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 0.2rem; }
  .trend { display: flex; align-items: center; gap: 6px; }
  .trend-delta { font-size: 12px; font-weight: 500; }
  .trend-delta.up { color: var(--warn-ink); }
  .trend-delta.down { color: var(--accent); }
  .trend-delta.flat { color: var(--ink-muted); }
  .spark { display: block; }

  .detail {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem 1.5rem;
    margin-bottom: 1.25rem;
  }
  .detail.open { display: block; }
  .detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .back-btn {
    font: inherit; font-size: 13px; color: var(--accent); background: none; border: none;
    cursor: pointer; padding: 0.3rem 0; display: flex; align-items: center; gap: 4px;
  }
  .detail-title { font-size: 17px; font-weight: 500; }
  .cal-layout { display: flex; gap: 1.3rem; align-items: flex-start; flex-wrap: wrap; }
  .cal-layout > .cal-grid { flex: 1 1 520px; min-width: 0; }
  .cal-totals { flex: 1 1 250px; }
  .cal-totals h3 { font-size: 12.5px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--ink-soft); margin: 0 0 0.7rem; }
  .cal-total-row { margin-bottom: 0.9rem; }
  .cal-total-head { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin-bottom: 3px; }
  .cal-total-head .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-total-line { display: flex; gap: 6px; font-size: 11.5px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; line-height: 1.5; }
  .cal-total-line .kind { flex: 0 0 4.6em; color: var(--ink-muted); }
  .cal-total-line .vals { flex: 1; min-width: 0; }
  .session-head { display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
  .session-nav { display: flex; gap: 0.9rem; flex-shrink: 0; }
  .session-nav button {
    font: inherit; font-size: 13px; color: var(--accent); background: none; border: none;
    cursor: pointer; padding: 0.3rem 0;
  }
  .session-nav button[disabled] { color: var(--ink-muted); cursor: default; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
  .detail-section h3 { font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); margin: 0 0 0.6rem; }
  .legend { display: flex; gap: 0.9rem; flex-wrap: wrap; margin-top: 0.5rem; font-size: 12px; color: var(--ink-soft); }
  .load-trend-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .load-trend-unit { text-transform: none; letter-spacing: 0; color: var(--ink-muted); font-weight: 400; }
  .load-trend-legend { margin-top: 0.6rem; gap: 0.5rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .tooltip {
    position: absolute; pointer-events: none; font-size: 11.5px;
    background: var(--ink); color: var(--card-bg); padding: 4px 8px; border-radius: 6px;
    transform: translate(-50%, -130%); white-space: nowrap; opacity: 0; transition: opacity 0.1s;
    z-index: 5;
  }
  .chart-wrap { position: relative; }

  .thr-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0.5rem 1.2rem; }
  .thr-row { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; font-size:12.5px; }
  .thr-input { width:80px; padding:0.2rem 0.4rem; font-size:12.5px; border:1px solid var(--border);
    border-radius:6px; background:var(--card); color:var(--ink); }
  .thr-actions { display:flex; align-items:center; gap:0.8rem; margin-top:0.7rem; flex-wrap:wrap; }
  .morning-banner {
    border:1px solid var(--accent); border-radius:10px; padding:0.8rem 1rem; margin-bottom:1rem;
    background:color-mix(in srgb, var(--accent) 7%, transparent);
  }
  .morning-banner ul { margin:0.4rem 0 0.6rem; padding-left:1.1rem; }
  .morning-banner li { font-size:13.5px; margin:0.25rem 0; }
  .banner-head { margin:0; font-weight:600; }
  .banner-code { font-size:11px; color:var(--ink-muted); margin-left:4px; }
  .banner-warn { font-size:11px; color:var(--z3); margin-left:4px; }
  .banner-note { margin:0; font-size:11.5px; color:var(--ink-muted); font-style:italic; }
  .hrv-row { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .hrv-name { flex:0 0 150px; font-size:13px; }
  .hrv-cells { display:flex; gap:3px; flex:1; }
  .hrv-cell { flex:1; height:22px; border-radius:3px; background:var(--accent); min-width:8px; }
  .hrv-cell.empty { background:transparent; border:1px dashed var(--border); }
  .hrv-pill {
    display:inline-block; margin-left:4px; padding:0 4px; border-radius:6px;
    font-size:10px; line-height:15px; background:var(--accent); color:#fff; vertical-align:middle;
  }
  .hrv-pill[data-hrv-day] { cursor:pointer; }
  .hrv-pill[data-hrv-day]:hover { filter:brightness(1.1); }
  .hrv-pill[data-hrv-day]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .empty-note { font-size: 12.5px; color: var(--ink-muted); font-style: italic; }

  .tabs { display: flex; gap: 0.35rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-soft);
    background: none; border: none; cursor: pointer;
    padding: 0.55rem 0.15rem; margin-right: 1.1rem; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .view { display: none; }
  .view.active { display: block; }

  .cal-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink-soft);
    background: var(--card-bg); border: none; padding: 0.4rem 0.8rem; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--accent-soft); color: var(--accent); }

  .cal-nav { display: flex; align-items: center; gap: 0.6rem; }
  .nav-btn {
    font: inherit; font-size: 13px; color: var(--ink-soft); background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 7px; width: 28px; height: 28px; cursor: pointer;
  }
  .nav-btn:hover { border-color: var(--border-strong); }
  .cal-label { font-size: 13.5px; font-weight: 500; min-width: 130px; text-align: center; }

  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;
    padding: 0.3rem 0.65rem 0.3rem 0.45rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--ink-soft); cursor: pointer; user-select: none;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip.off { opacity: 0.4; }
  .chip.chip-all { font-weight: 600; color: var(--accent); border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { font-size: 11px; color: var(--ink-muted); text-align: center; padding-bottom: 4px; }
  .cal-day {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    min-height: 74px; padding: 5px 6px; display: flex; flex-direction: column; gap: 4px;
  }
  .cal-day.out { background: transparent; border-color: transparent; }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .load-trend-day { cursor: pointer; }
  .load-trend-day:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .day-num { font-size: 11px; color: var(--ink-muted); }
  .day-chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .a-chip {
    width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600; color: #fff; cursor: default; position: relative;
  }
  /* Chips that open a session read as controls, not decoration. */
  .open-session { cursor: pointer; }
  .open-session:hover { filter: brightness(1.08); }
  .open-session:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cal-grid.week .cal-day { min-height: 150px; }
  .cal-grid.week .day-chips { flex-direction: column; gap: 5px; }
  .week-chip { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink); }
  .week-chip .mini-bar { flex: 1; height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--border); }
  .week-chip .mini-bar > span { height: 100%; }

  #inviteOverlay, #accountOverlay, #joinOverlay { position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center; padding:1rem; z-index:50; }
  #inviteOverlay[hidden], #accountOverlay[hidden], #joinOverlay[hidden] { display:none; }
  #inviteCard, #accountCard, #joinCard { background:var(--card-bg); color:var(--ink); border-radius:14px;
    padding:1.5rem; max-width:420px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.35); }
  #inviteCard h2, #accountCard h2, #joinCard h2 { margin:0 0 .75rem; font-size:1.1rem; }
  #inviteCard h3 { margin:1.25rem 0 .25rem; font-size:.9rem; }
  #inviteCard p, #accountCard p, #joinCard p { font-size:13px; line-height:1.5; margin:.5rem 0; }
  #accountCard label, #inviteCard label { display:block; font-size:12px; font-weight:600; margin:.75rem 0 .2rem; }
  #accountCard input, #inviteCard input, #inviteCard select { width:100%; box-sizing:border-box; font:inherit; font-size:14px;
    padding:.45rem .6rem; border:1px solid var(--border-strong); border-radius:8px;
    background:var(--bg); color:var(--ink); }
  .dialog-row { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  .dialog-error { color:var(--i3); font-size:12px; }
  .invite-link { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px;
    word-break:break-all; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:.5rem .6rem; margin:.75rem 0 0; }
  .invite-pending { list-style:none; padding:0; margin:.25rem 0 0; font-size:12px; }
  .invite-pending li { display:flex; justify-content:space-between; align-items:center; gap:.5rem;
    padding:.4rem 0; border-top:1px solid var(--border); }
  #teamSelect { font:inherit; font-size:13px; padding:.3rem .5rem; border:1px solid var(--border-strong);
    border-radius:8px; background:var(--card-bg); color:var(--ink); max-width:14rem; }
  #accountError { color:var(--i3); font-size:12px; margin:.6rem 0 0; }
  #accountRow { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  #accountGoogle { display:flex; align-items:center; justify-content:center; gap:.55rem;
    width:100%; font:inherit; font-size:14px; padding:.5rem .8rem; cursor:pointer;
    border:1px solid var(--border-strong); border-radius:8px;
    background:var(--card-bg-hover); color:var(--ink); }
  #accountGoogle:hover { border-color:var(--accent); }
  #accountGoogle svg { width:17px; height:17px; flex:none; }
  .account-or { display:flex; align-items:center; gap:.6rem; margin:.9rem 0 .2rem;
    color:var(--ink-muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .account-or::before, .account-or::after { content:""; flex:1; height:1px; background:var(--border); }
  /* White quiet zone regardless of theme — scanners need the contrast. */
  #inviteQR { background:#fff; padding:12px; border-radius:10px; margin:1rem 0;
    display:flex; justify-content:center; }
  #inviteQR svg { width:100%; max-width:260px; height:auto; display:block; }
  .invite-warn { color:var(--warn, #b06a00); }
  #inviteCard dl { font-size:12px; margin:.5rem 0 0; }
  #inviteCard dt { font-weight:600; margin-top:.5rem; }
  #inviteCard dd { margin:.15rem 0 0; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break:break-all; }
  .chart-note { font-size:11px; color:var(--ink-muted); margin:.35rem 0 0; }
  /* The squad grid: a square per athlete per morning, colour by state. */
  .hrv-squad { overflow-x:auto; }
  .hrv-squad table { border-collapse:collapse; font-size:13px; min-width:620px; width:100%; }
  .hrv-squad th { font-weight:500; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-muted); padding:.3rem .25rem .5rem; text-align:center; font-variant-numeric:tabular-nums; }
  .hrv-squad th.name { text-align:left; }
  .hrv-squad td { padding:.28rem .25rem; text-align:center; }
  .hrv-squad td.name { text-align:left; font-weight:500; white-space:nowrap; padding-right:.9rem; }
  .hrv-squad tbody tr:hover td, .hrv-squad tr:hover td { background:var(--card-bg-hover); }
  .hrv-d { width:15px; height:15px; border-radius:4px; display:inline-block; vertical-align:-2px; }
  .hrv-d.ok { background:var(--z1); }
  .hrv-d.watch { background:var(--i2); }
  .hrv-d.alert { background:var(--i3); }
  /* Dashed rather than pale: a morning without a test is an absence, and an
     absence that looks like a faint value gets read as a faint value. */
  .hrv-d.none { background:transparent; border:1px dashed var(--border-strong); }
  .hrv-d.partial { background:repeating-linear-gradient(45deg, var(--border-strong) 0 3px, transparent 3px 6px);
    border:1px solid var(--border-strong); }
  .hrv-d[data-hrv-open] { cursor:pointer; }
  .hrv-d.sel { outline:2px solid var(--ink); outline-offset:2px; }
  /* A bar on the athlete's page that opens its morning in the HRV tab. */
  .hrv-jump { cursor:pointer; }
  .hrv-jump:focus { outline:none; }
  .hrv-jump:hover rect:last-of-type { opacity:.75; }
  .hrv-jump:focus-visible rect:first-of-type { stroke:var(--ink); stroke-width:1.5; }
  .hrv-shown { margin:0 .25rem .7rem; font-size:12px; color:var(--ink-muted); }
  .hrv-shown strong { color:var(--ink); }
  .hrv-legend { display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; font-size:12px;
    color:var(--ink-muted); margin-top:.9rem; }
  .hrv-key { display:inline-flex; align-items:center; gap:.35rem; }
  .block-t { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:10px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); margin:.9rem 0 .4rem; }
  .hrv-swatch { width:11px; height:11px; border-radius:2px; display:inline-block; }
  .hrv-swatch.ref { height:2px; border-radius:0; background:var(--ink-soft); }
  .hrv-swatch.band { background:var(--accent-soft); border:1px solid var(--accent); }
  .hrv-table { width:100%; border-collapse:collapse; font-size:12px; }
  .hrv-table th { text-align:left; font-weight:500; font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-muted); padding:.3rem .3rem .45rem; }
  .hrv-table th.r, .hrv-table td.r { text-align:right; }
  .hrv-table td { padding:.32rem .3rem; border-top:1px solid var(--border);
    font-variant-numeric:tabular-nums; }
  .hrv-table tr.posrow td { padding-top:.6rem; border-top:none; font-size:10px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); }
  .hrv-remedy { margin:.55rem 0 0; padding-left:.7rem; border-left:2px solid var(--accent);

  .drawer > summary:hover { color:var(--accent); }
  .drawer-body { margin-top:.8rem; }
  .help { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;

  .help:hover > span, .help:focus-within > span { display:block; }

  .above { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-top:.2rem; }

  };
  const LANG = (() => {
    const asked = new URL(location.href).searchParams.get("lang");
    if (asked === "fr" || asked === "en") { try { localStorage.setItem("moveload-lang", asked); } catch (e) {} return asked; }
    let saved = null;
    try { saved = localStorage.getItem("moveload-lang"); } catch (e) {}
    if (saved === "fr" || saved === "en") return saved;
    return (navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr";
  })();
  const LOCALE = LANG === "en" ? "en-GB" : "fr-FR";
  function t(fr) { return LANG === "en" ? (EN[fr] ?? fr) : fr; }

  // The static shell carries its French in the markup, so it is translated in
  // place on load rather than re-rendered.
  function translateStaticShell() {
    document.documentElement.lang = LANG;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    document.title = t("MoveLoad Coach — suivi des athlètes");
    const guide = document.getElementById("guideLink");
    if (guide && LANG === "en") guide.setAttribute("href", "guide.en.html#coach");
    const toggle = document.getElementById("langBtn");
    if (toggle) {
      // Shows the language it switches *to*, which is what a reader who cannot
      // read the current one needs to see.
      toggle.textContent = LANG === "en" ? "Français" : "English";
      toggle.addEventListener("click", () => {
        try { localStorage.setItem("moveload-lang", LANG === "en" ? "fr" : "en"); } catch (e) {}
        const url = new URL(location.href);
        url.searchParams.set("lang", LANG === "en" ? "fr" : "en");
        location.href = url.toString();
      });
    }
  }

  const RADAR_WINDOWS = [3, 6, 9, 15, 30, 45, 90, 180];

  const lastSyncEl = document.getElementById("lastSync");

  // A listener without an error callback reports a refused read as an empty
  // collection, which is indistinguishable from an athlete who has simply not
  // synced yet — the failure mode that hid the missing hrv and config rules.
  function listenerFailed(what, err) {
    lastSyncEl.textContent = t("Erreur de synchro : ") + what + " — " + err.message;
  }

  // --- Which team this page shows -------------------------------------------
  // From the URL, then from this browser's memory, and only among the teams
  // the signed-in account coaches: the rules open nothing else.
  const pageParams = new URLSearchParams(location.search);

  function rememberedTeam() {
    const code = pageParams.get("team") || localStorage.getItem("moveload_team_code");
    if (code) {
      localStorage.setItem("moveload_team_code", code);
      const url = new URL(location.href);
      url.searchParams.set("team", code);
      history.replaceState(null, "", url);
    }
    return code;
  }

  /// Shows another team. A reload rather than re-wiring, for the same reason
  /// as signing out: every listener on the page is keyed on the team.
  function openTeam(code) {
    try { localStorage.setItem("moveload_team_code", code); } catch (e) {}
    const url = new URL(location.href);
    url.searchParams.set("team", code);
    url.searchParams.delete("join");
    url.searchParams.delete("invite");
    location.replace(url.toString());
  }


  /// A coach's or co-owner's invitation link: ?join=<team>&invite=<id>.
  const joinRequest = pageParams.get("join") && pageParams.get("invite")
    ? { teamId: pageParams.get("join"), inviteId: pageParams.get("invite") }
    : null;

  translateStaticShell();
  let firestore = null;
  const teamCode = joinRequest ? null : rememberedTeam();

  // --- Seats -----------------------------------------------------------------
  // A seat is teams/{team}/memberships/{uid}, and it is what the rules believe.
  // users/{uid}.teamIds is only an index to find seats by: they cannot be
  // queried across teams.

  const INVITE_DAYS = 7;
  let signedInUser = null;
  let currentSeat = null;

  function canInvite(seat) { return !!seat && (seat.role === "coach" || seat.role === "owner"); }

  function roleName(role) {
    return t({ athlete: "Athlète", coach: "Entraîneur", owner: "Copropriétaire" }[role] || role);
  }

  /// The seats this account holds, among the teams its index names and the
  /// team this browser last showed. Each seat is read, because the index can
  /// name a team the account has since left.
  async function mySeats(db, user) {
    const indexRef = doc(db, "users", user.uid);
    let indexed = [];
    try {
      const snap = await getDoc(indexRef);
      if (snap.exists() && Array.isArray(snap.data().teamIds)) indexed = snap.data().teamIds;
    } catch (e) { /* no index yet */ }

    const candidates = teamCode && !indexed.includes(teamCode) ? indexed.concat([teamCode]) : indexed;
    const seats = [];
    for (const teamId of candidates) {
      try {
        const snap = await getDoc(doc(db, "teams", teamId, "memberships", user.uid));
        if (snap.exists()) seats.push({ teamId, ...snap.data() });
      } catch (e) { /* not a team this account may look at */ }
    }

    // A seat written by hand in the console has no index entry: add it, so the
    // page finds that team next time without a remembered code.
    const missing = seats.map(s => s.teamId).filter(id => !indexed.includes(id));
    if (missing.length) {
      setDoc(indexRef, { teamIds: indexed.concat(missing) }, { merge: true })
        .catch(err => listenerFailed(t("Compte"), err));
    }
    return seats;
  }

  async function addToTeamIndex(db, user, teamId) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    const known = snap.exists() && Array.isArray(snap.data().teamIds) ? snap.data().teamIds : [];
    if (!known.includes(teamId)) await setDoc(ref, { teamIds: known.concat([teamId]) }, { merge: true });
  }

  /// The team's own name, when an owner has given it one. Absent by default:
  /// nothing writes teams/{id} until the name is saved, so the document itself
  /// may well not exist — hence the empty string rather than an error.
  async function teamNameOf(db, teamId) {
    try {
      const snap = await getDoc(doc(db, "teams", teamId));
      if (snap.exists() && snap.data().name) return snap.data().name;
    } catch (e) { /* a team this account may not read */ }
    return "";
  }

  function showTeamName(name) {
    const select = document.getElementById("teamSelect");
    const el = document.getElementById("teamName");
    if (!select.hidden) {
      // The picker already carries the names: one place, not two.
      const chosen = select.options[select.selectedIndex];
      if (chosen && name) chosen.textContent = name;
      el.hidden = true;
      return;
    }
    el.textContent = name || "";
    el.hidden = !name;
  }

  /// One entry per team this account coaches, shown only when there is a choice.
  async function renderTeamPicker(db, seats) {
    const coached = seats.filter(canInvite);
    const select = document.getElementById("teamSelect");
    if (coached.length < 2) {
      // One team: nothing to choose between, so the name is there to say whose
      // figures these are, not to pick.
      showTeamName(await teamNameOf(db, teamCode));
      return;
    }
    const names = await Promise.all(coached.map(async s =>
      (await teamNameOf(db, s.teamId)) || s.teamId.slice(0, 8) + "…"));
    select.innerHTML = coached.map((s, i) =>
      '<option value="' + esc(s.teamId) + '"' + (s.teamId === teamCode ? " selected" : "") + ">" +
      esc(names[i]) + "</option>").join("");
    select.hidden = false;
    select.addEventListener("change", () => openTeam(select.value));
  }

  // --- Inviting ----------------------------------------------------------------
  // An invitation is teams/{team}/invites/{random id}: one seat, one role, one
  // week. Athletes scan theirs in the app; coaches and co-owners open a link.

  let inviteState = null;

  /// Must match TeamInvitation.payload in SyncKit. Built by hand rather than
  /// with URLSearchParams, which encodes a space as "+"; Swift's URLComponents
  /// reads "+" as a literal plus, so a team id containing a space would arrive
  /// corrupted on the phone.
  function joinPayload(teamId, inviteId) {
    const q = [["t", teamId], ["i", inviteId], ["p", firebaseConfig.projectId], ["k", firebaseConfig.apiKey]]
      .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
    return "moveload://join?" + q;
  }

  function joinLink(teamId, inviteId) {
    const url = new URL(location.href);
    url.search = "";
    url.hash = "";
    url.searchParams.set("join", teamId);
    url.searchParams.set("invite", inviteId);
    if (USE_EMULATOR) url.searchParams.set("emulator", "");
    return url.toString();
  }

  function inviteExpiry(invite) {
    const created = invite.createdAt && invite.createdAt.toMillis ? invite.createdAt.toMillis() : null;
    return created === null ? null : new Date(created + INVITE_DAYS * 24 * 3600 * 1000);
  }

  async function showInvite() {
    inviteState = { role: "athlete", athleteId: "", created: null, busy: false, error: null,
                    pending: [], seatedAthletes: new Set(),
                    // null, not "": a name typed but not yet saved must survive
                    // the re-reads that revoking an invitation triggers.
                    teamName: null, teamExists: false, nameError: null,
                    nameSaved: false, savingName: false };
    document.getElementById("inviteBody").innerHTML = "";
    document.getElementById("inviteOverlay").hidden = false;
    await refreshInvites();
  }

  function hideInvite() { document.getElementById("inviteOverlay").hidden = true; }

  /// Pending invitations, and which athletes already hold a seat. Read when
  /// needed rather than listened to: only this dialog changes them.
  async function refreshInvites() {
    const s = inviteState;
    try {
      const [invites, seats, team] = await Promise.all([
        getDocs(collection(firestore, "teams", teamCode, "invites")),
        getDocs(collection(firestore, "teams", teamCode, "memberships")),
        // Caught here rather than by the whole batch: a team without a name is
        // the normal case, and it must not empty the list of invitations.
        getDoc(doc(firestore, "teams", teamCode)).catch(() => null)
      ]);
      s.teamExists = !!(team && team.exists());
      if (s.teamName === null) s.teamName = (s.teamExists && team.data().name) || "";
      const now = Date.now();
      s.pending = invites.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(inv => !inv.usedBy && (!inviteExpiry(inv) || inviteExpiry(inv).getTime() > now))
        .sort((a, b) => (inviteExpiry(b)?.getTime() ?? 0) - (inviteExpiry(a)?.getTime() ?? 0));
      s.seatedAthletes = new Set(seats.docs.map(d => d.data().athleteId).filter(Boolean));
    } catch (err) {
      s.error = err.message;
    }
    renderInvite();
  }

  function athleteName(id) {
    const a = athletes.find(x => x.id === id);
    return a ? (a.name || id) : id;
  }

  function renderInvite() {
    const s = inviteState;
    const owner = currentSeat.role === "owner";
    const button = (id, label, disabled) =>
      '<button class="nav-btn" id="' + id + '" style="width:auto; padding:0.4rem 1rem;"' +
      (disabled ? " disabled" : "") + ">" + esc(label) + "</button>";

    if (!s.created) {
      const roles = owner ? ["athlete", "coach", "owner"] : ["athlete"];
      html += '<label for="inviteRole">' + esc(t("Rôle")) + "</label>" +
        '<select id="inviteRole">' + roles.map(r =>
          '<option value="' + r + '"' + (r === s.role ? " selected" : "") + ">" + esc(roleName(r)) + "</option>"
        ).join("") + "</select>";
      if (s.role === "athlete") {
        const roster = athletes.slice().sort((a, b) => (a.name || "").localeCompare(b.name || "", LOCALE));
        html += '<label for="inviteAthlete">' + esc(t("Fiche athlète")) + "</label>" +
          '<select id="inviteAthlete"><option value="">' + esc(t("Nouvel athlète, sans fiche")) + "</option>" +

            esc(a.name || a.id) + (s.seatedAthletes.has(a.id) ? esc(t(" — a déjà sa place")) : "") + "</option>"
          ).join("") + "</select>" +
          "<p>" + esc(t("Si l'athlète synchronise déjà, choisissez sa fiche : ses séances restent les siennes.")) + "</p>";
      } else {
        html += "<p>" + esc(s.role === "owner"
          ? t("Un copropriétaire administre l'équipe à égalité avec vous : il invite les entraîneurs et peut retirer n'importe quel membre, vous compris.")
          : t("Un entraîneur voit toute l'équipe et invite des athlètes.")) + "</p>";
      }

      } else {
        html += "<p>" + esc(t("Envoyez ce lien à la personne invitée. Elle l'ouvre, se connecte avec son propre compte et retrouve l'équipe.")) + "</p>" +
          '<div class="invite-link">' + esc(joinLink(teamCode, c.id)) + "</div>";
      }
      html += '<p class="chart-note">' + esc(t("Valable sept jours, pour une seule personne.")) + "</p>" +
        '<div class="dialog-row">' + (c.role === "athlete" ? "" : button("inviteCopy", t("Copier le lien"))) +
        button("inviteAnother", t("Nouvelle invitation")) + button("inviteClose", t("Fermer")) + "</div>";
    }

    html += "<h3>" + esc(t("Invitations en attente")) + "</h3>";
    if (s.error) {
      html += '<p class="dialog-error">' + esc(s.error) + "</p>";
    } else if (!s.pending.length) {
      html += '<p class="chart-note">' + esc(t("Aucune invitation en attente.")) + "</p>";
    } else {
      html += '<ul class="invite-pending">' + s.pending.map(inv => {
        const expiry = inviteExpiry(inv);
        // The rules let a coach revoke athlete invitations only.
        const revocable = owner || inv.role === "athlete";
        return "<li><span>" + esc(roleName(inv.role) + (inv.athleteId ? " — " + athleteName(inv.athleteId) : "")) +
          (expiry ? '<br><span class="chart-note">' + esc(t("expire le ") +
            expiry.toLocaleDateString(LOCALE, { day: "numeric", month: "long" })) + "</span>" : "") +
          "</span>" + (revocable ? '<button class="link-btn" data-revoke="' + esc(inv.id) + '">' + esc(t("Révoquer")) + "</button>" : "") +

    }

    if (owner) {
      html += "<h3>" + esc(t("Nom de l'équipe")) + "</h3>" +
        "<p>" + esc(t("Ce nom remplace le code de l'équipe, en haut du tableau de bord et dans l'app des athlètes.")) + "</p>" +
        '<input id="teamNameInput" type="text" maxlength="60" value="' + esc(s.teamName || "") +
        '" placeholder="' + esc(teamCode.slice(0, 8) + "…") + '">' +
        (s.nameError ? '<p class="dialog-error">' + esc(s.nameError) + "</p>" : "") +
        '<div class="dialog-row">' +
        button("teamNameSave", s.nameSaved ? t("Nom enregistré") : t("Enregistrer le nom"), s.savingName) +
        "</div>";
    }

    const body = document.getElementById("inviteBody");
    body.innerHTML = html;
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
    const roleSelect = document.getElementById("inviteRole");
    if (roleSelect) roleSelect.addEventListener("change", () => { s.role = roleSelect.value; s.athleteId = ""; renderInvite(); });
    const athleteSelect = document.getElementById("inviteAthlete");
    if (athleteSelect) athleteSelect.addEventListener("change", () => { s.athleteId = athleteSelect.value; });
    const nameInput = document.getElementById("teamNameInput");
    if (nameInput) {
      // Held in the state at every keystroke: the dialog redraws whole, and a
      // half-typed name would otherwise vanish when the role select changes.
      nameInput.addEventListener("input", () => {
        s.teamName = nameInput.value;
        s.nameSaved = false;
      });
      nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") saveTeamName(); });
    }
    on("teamNameSave", saveTeamName);
    on("inviteCreate", createInvite);
    on("inviteClose", hideInvite);
    // The next invitation starts blank: carrying the record over would hand the
    // same athlete's profile to whoever receives it.
    on("inviteAnother", () => { s.created = null; s.athleteId = ""; renderInvite(); });
    on("inviteCopy", async () => {
      try {
        await navigator.clipboard.writeText(joinLink(teamCode, s.created.id));
        document.getElementById("inviteCopy").textContent = t("Lien copié");
      } catch (e) { /* the link stays on screen to copy by hand */ }
    });
    body.querySelectorAll("[data-revoke]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true;
      try {
        await deleteDoc(doc(firestore, "teams", teamCode, "invites", b.dataset.revoke));
        if (s.created && s.created.id === b.dataset.revoke) s.created = null;
      } catch (err) { s.error = err.message; }
      await refreshInvites();
    }));

    if (s.created && s.created.role === "athlete") {
      // Generated in the browser, never sent anywhere: the invitation id in
      // it is a bearer token for one seat until it is used or expires.
      const qr = qrcode(0, "M");
      qr.addData(joinPayload(teamCode, s.created.id));
      qr.make();
      document.getElementById("inviteQR").innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
    }
  }

  /// Nothing else ever writes teams/{id}: the document does not exist until an
  /// owner names it. So the first save is a creation, which the rules ask to
  /// carry createdBy, and every later one an update, which they forbid to touch
  /// it — hence the two payloads rather than one merge.
  async function saveTeamName() {
    const s = inviteState;
    const name = (s.teamName || "").trim().replace(/\s+/g, " ");
    s.savingName = true;
    s.nameError = null;
    renderInvite();
    try {
      await setDoc(doc(firestore, "teams", teamCode),
        s.teamExists ? { name }
                     : { name, createdBy: signedInUser.uid, createdAt: serverTimestamp() },
        { merge: true });
      s.teamExists = true;
      s.teamName = name;
      s.nameSaved = true;
      showTeamName(name);
    } catch (err) {
      s.nameError = err.message;
    }
    s.savingName = false;
    renderInvite();
  }

  async function createInvite() {
    const s = inviteState;
    s.busy = true;
    s.error = null;
    renderInvite();
    try {
      const ref = doc(collection(firestore, "teams", teamCode, "invites"));
      const data = { role: s.role, createdBy: signedInUser.uid, createdAt: serverTimestamp() };
      // Naming the record is what hands it over: without it, the athlete's
      // phone could not take back a record its old anonymous account wrote.
      if (s.role === "athlete" && s.athleteId) data.athleteId = s.athleteId;
      await setDoc(ref, data);
      s.created = { id: ref.id, role: s.role, athleteId: data.athleteId || "" };
    } catch (err) {
      s.error = err.message;
    }
    s.busy = false;
    await refreshInvites();
  }

  document.getElementById("inviteOverlay").addEventListener("click", (e) => {
    if (e.target.id === "inviteOverlay") hideInvite();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideInvite(); });

  document.getElementById("inviteBtn").addEventListener("click", () => {
    if (canInvite(currentSeat)) { showInvite(); return; }
    showAccount(signedInUser && !signedInUser.isAnonymous
      ? t("Ce compte n'a pas de place d'entraîneur ou de propriétaire dans cette équipe : il ne peut pas inviter.")
      : t("Pour inviter, connectez-vous avec le compte qui a une place d'entraîneur ou de propriétaire dans cette équipe."));
  });

  // --- Joining from a link -------------------------------------------------------

  function renderJoin(html) {
    document.getElementById("joinBody").innerHTML = html;
    document.getElementById("joinOverlay").hidden = false;
  }

  function joinFailed(message) {
    renderJoin("<p>" + esc(message) + "</p>" +
      '<div class="dialog-row"><button class="nav-btn" id="joinDismiss" style="width:auto; padding:0.4rem 1rem;">' +
      esc(t("Fermer")) + "</button></div>");
    document.getElementById("joinDismiss").addEventListener("click", () => {
      const url = new URL(location.href);
      url.searchParams.delete("join");
      url.searchParams.delete("invite");
      location.replace(url.toString());
    });
  }

  /// Opened by the person invited, who may not be signed in yet — or signed in
  /// with another of their accounts, which is why the account taking the seat
  /// is named before anything is written.
  async function showJoin(db, user) {
    if (!user || user.isAnonymous) {
      renderJoin("<p>" + esc(t("Cette invitation vous propose une place dans une équipe MoveLoad. Connectez-vous ou créez un compte pour l'accepter : la place sera attachée à ce compte.")) + "</p>" +
        '<div class="dialog-row"><button class="nav-btn" id="joinSignIn" style="width:auto; padding:0.4rem 1rem;">' +
        esc(t("Se connecter ou créer un compte")) + "</button></div>");
      document.getElementById("joinSignIn").addEventListener("click", () => showAccount());
      return;
    }

    renderJoin("<p>" + esc(t("Vérification de l'invitation…")) + "</p>");
    const { teamId, inviteId } = joinRequest;
    const inviteRef = doc(db, "teams", teamId, "invites", inviteId);
    const seatRef = doc(db, "teams", teamId, "memberships", user.uid);
    let invite, seat;
    try {
      const [inviteSnap, seatSnap] = await Promise.all([getDoc(inviteRef), getDoc(seatRef)]);
      invite = inviteSnap.exists() ? inviteSnap.data() : null;
      seat = seatSnap.exists() ? seatSnap.data() : null;
    } catch (err) {
      joinFailed(err.message);
      return;
    }

    if (!invite) return joinFailed(t("Cette invitation n'existe pas, ou a été révoquée. Demandez-en une nouvelle."));
    if (invite.usedBy) {
      // Accepted already by this very account: the link opened a second time.
      if (invite.usedBy === user.uid && seat) return openTeam(teamId);
      return joinFailed(t("Cette invitation a déjà été utilisée. Chaque invitation ne sert qu'une fois : demandez-en une nouvelle."));
    }
    // Checked before the invitation is consumed: a seat never changes role, so
    // the batch would be refused and the invitation wasted.
    if (seat) return joinFailed(t("Ce compte a déjà une place dans cette équipe."));
    const expiry = inviteExpiry(invite);
    if (expiry && expiry.getTime() < Date.now()) {
      return joinFailed(t("Cette invitation a expiré : elle n'est valable que sept jours. Demandez-en une nouvelle."));
    }
    if (invite.role === "athlete") return joinFailed(t("Cette invitation est destinée à un athlète : elle se scanne dans l'app MoveLoad."));

    renderJoin(
      "<p>" + esc(t("Rôle proposé : ")) + "<strong>" + esc(roleName(invite.role)) + "</strong></p>" +
      "<p>" + esc(t("Compte : ")) + "<strong>" + esc(user.email || "") + "</strong></p>" +
      '<p class="chart-note">' + esc(t("La place appartiendra à ce compte. Si ce n'est pas le bon, changez de compte avant d'accepter.")) + "</p>" +
      '<p class="dialog-error" id="joinError" hidden></p>' +
      '<div class="dialog-row">' +
        '<button class="nav-btn" id="joinAccept" style="width:auto; padding:0.4rem 1rem;">' + esc(t("Rejoindre l'équipe")) + "</button>" +
        '<button class="nav-btn" id="joinSwitch" style="width:auto; padding:0.4rem 1rem;">' + esc(t("Changer de compte")) + "</button>" +
      "</div>");
    document.getElementById("joinSwitch").addEventListener("click", async () => {
      await signOut(authInstance);
      location.reload();
    });
    document.getElementById("joinAccept").addEventListener("click", async (e) => {
      e.target.disabled = true;
      try {
        // One batch: the rules accept the seat only with this invitation
        // consumed by it, and the invitation only consumed by that seat.
        const batch = writeBatch(db);
        batch.set(seatRef, { role: invite.role, via: inviteId });
        batch.update(inviteRef, { usedBy: user.uid, usedAt: serverTimestamp() });
        await batch.commit();
        await addToTeamIndex(db, user, teamId);
        openTeam(teamId);
      } catch (err) {
        const errorEl = document.getElementById("joinError");
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        e.target.disabled = false;
      }
    });
  }
  let athletes = [];
  const activeAthletes = new Set();
  const knownAthleteIds = new Set();
  const sessionUnsubByAthlete = new Map();
  const hrvUnsubByAthlete = new Map();
  const hrvConfigUnsubByAthlete = new Map();
  const hrvNotesUnsubByAthlete = new Map();
  let sessionFilterMode = "all"; // "all" | "training" | "test"

  // Fenêtre des deux courbes d'évolution de la charge. 0 = tout l'historique.
  const LOAD_TREND_PERIODS = [30, 90, 180, 0];
  const LOAD_TREND_LABEL = { 30: "30 jours", 90: "3 mois", 180: "6 mois", 0: "Tout" };
  let loadTrendDays = 30;

  function matchesFilterMode(s) {
    return sessionFilterMode === "all" || (sessionFilterMode === "test" ? s.isTest : !s.isTest);
  }

  function ensureAthlete(id) {
    let a = athletes.find(x => x.id === id);
    if (!a) {
      a = { id, name: id, gender: "H", boatType: null, sessions: [], color: PALETTE[athletes.length % PALETTE.length] };
      athletes.push(a);
    }
    return a;
  }

  /// Boats the coach has picked by hand, overriding the guess below.
  ///
  /// Kept on this browser rather than in Firestore: it is one coach's reading
  /// of one athlete, it needs no write access, and getting it wrong costs a
  /// re-pick rather than corrupted training data. The cost is that a coach on
  /// a second device makes the choice again.
  const BOAT_OVERRIDE_KEY = "moveload_boat_overrides_" + teamCode;

  function loadBoatOverrides() {
    try { return JSON.parse(localStorage.getItem(BOAT_OVERRIDE_KEY)) || {}; }
    catch { return {}; }
  }

  let boatOverrides = loadBoatOverrides();

  function setBoatOverride(athleteId, boat) {
    if (boat) boatOverrides[athleteId] = boat;
    else delete boatOverrides[athleteId];
    try { localStorage.setItem(BOAT_OVERRIDE_KEY, JSON.stringify(boatOverrides)); } catch {}
  }

  /// The boat an athlete is *categorised* under, for their records and for
  /// the peer group they are compared against.
  ///
  /// Deliberately the most-used boat, not the most recent one. Taking the
  /// latest session let a single outing in another boat reclassify an
  /// athlete's whole history: one C1 session moved a K1 paddler into the C1
  /// category, hid every K1 record behind a same-boat filter that no longer
  /// matched, and compared him against C1 athletes. Ties go to whichever boat
  /// was used most recently, so a genuine switch still takes effect as soon
  /// as it is no longer a minority.
  function dominantBoatType(sorted, last) {
    const counts = new Map();
    sorted.forEach(s => {
      if (!s.boatType) return;
      counts.set(s.boatType, (counts.get(s.boatType) || 0) + 1);
    });
    if (counts.size === 0) return last ? last.boatType : null;

    let best = null, bestCount = -1;
    // Walk newest first so an equal count resolves to the more recent boat.
    for (let i = sorted.length - 1; i >= 0; i--) {
      const boat = sorted[i].boatType;
      if (!boat) continue;
      const count = counts.get(boat);
      if (count > bestCount) { best = boat; bestCount = count; }
    }
    return best;
  }

  function deriveAthlete(a) {
    const sorted = [...a.sessions].filter(matchesFilterMode).sort((x, y) => x.date.localeCompare(y.date));
    const last = sorted[sorted.length - 1];
    a.initial = (a.name || "?").charAt(0).toUpperCase();
    a.lastSession = last ? last.date : null;
    a.duration = last ? last.duration : 0;
    // Boats the athlete has actually paddled — offering one they have never
    // used would only produce an empty radar.
    const paddling = sorted.filter(s => !s.isConditioning);
    a.availableBoats = [...new Set(paddling.map(x => x.boatType).filter(Boolean))];
    a.defaultBoatType = dominantBoatType(paddling, paddling[paddling.length - 1] || null);
    // An override is honoured only while it still matches a boat in the data,
    // so a stale choice cannot quietly empty the records.
    const chosen = boatOverrides[a.id];
    a.boatIsOverridden = !!chosen && a.availableBoats.includes(chosen);
    a.boatType = a.boatIsOverridden ? chosen : a.defaultBoatType;
    a.hr = last ? last.hr : [0, 0, 0];
    a.mech = last ? last.mech : [0, 0, 0];
    a.rpe = last ? last.rpe : null;
    a.lastSessionIsTest = last ? !!last.isTest : false;
    a.lastSessionIsConditioning = last ? !!last.isConditioning : false;
    // Morning tests, most recent last. A missing day stays missing — never
    // interpolated: a gap in the series is itself the signal, and often the
    // first one, since an athlete who stops testing is usually an athlete
    // something is wrong with.
    a.hrv = a.hrv || [];
    a.hrvRecent = a.hrv.slice(-14);
    a.hrvToday = a.hrv.length ? a.hrv[a.hrv.length - 1] : null;
    a.strokeSignal = last ? last.strokeSignal : null;
    a.strokeRateHz = last ? last.strokeRateHz : 0;
    a.lastSessionName = last ? (last.name || "") : "";
    a.lastSessionPeaks = last ? (last.mechanicalPeaks || {}) : {};
    // Which session the detail view is showing when no other was asked for.
    // Needed to step to the one before or after it — without this, the arrows
    // would have no starting point on the default view.
    a.lastSessionId = last ? last.id : null;

    const daysSince = last ? Math.round((new Date() - new Date(last.date + "T12:00:00")) / 86400000) : null;
    if (daysSince !== null && daysSince > 10) {
      a.status = "watch";
      a.note = t("Aucune séance depuis %d jours").replace("%d", daysSince);
    } else {
      a.status = "ok";
      a.note = undefined;
    }

    a.history = paddling
      .filter(s => s.mechanicalPeaks && s.mechanicalPeaks["45"] != null)
      .slice(-8)
      .map(s => ({ d: shortDate(s.date), v: s.mechanicalPeaks["45"] }));

    // Each window's record can come from a different session — a 3 s best from
    // a sprint, a 3 min best from a long piece — so the date is kept per
    // window rather than as one date for the whole curve.
    function bestByWindow(pool) {
      const records = {}, dates = {};
      RADAR_WINDOWS.forEach(w => {
        let best = 0, bestDate = null;
        pool.forEach(s => {
          const v = s.mechanicalPeaks && s.mechanicalPeaks[String(w)];
          if (v != null && v > best) { best = v; bestDate = s.date; }
        });
        records[w] = best;
        dates[w] = bestDate;
      });
      return { records, dates };
    }

    const own = bestByWindow(paddling.filter(s => s.boatType === a.boatType));
    a.records = own.records;
    a.recordDates = own.dates;

    // The session-vs-record curve draws one line from the last session and one
    // from a record pool, so both have to describe the same boat. They did not:
    // the record was always filtered to the athlete's dominant boat while the
    // session line was whatever was recorded last. A session in another boat —
    // or, far more often, one whose boat was simply never set, which the app
    // syncs as an empty string — sat outside the pool and could therefore be
    // drawn *above* the record, reading as a personal best that exists nowhere.
    const curveBoat = last && !last.isConditioning ? last.boatType : null;
    a.curveBoat = curveBoat;
    if (!curveBoat) {
      a.curveRecords = null;
      a.curveRecordDates = null;
    } else if (curveBoat === a.boatType) {
      a.curveRecords = own.records;
      a.curveRecordDates = own.dates;
    } else {
      const other = bestByWindow(paddling.filter(s => s.boatType === curveBoat));
      a.curveRecords = other.records;
      a.curveRecordDates = other.dates;
    }
  }

  function onDataChanged() {
    render();
    renderMorningBanner();
    renderCalFilters();
    if (viewCalendar.classList.contains("active")) renderCalendar();
    if (viewHrv.classList.contains("active")) renderHrvGrid();
  }

  function startListening(db) {
    // The squad's roster: one small pointer per athlete, name and gender.
    // The data itself moved out from under the team to athletes/{id}, so an
    // athlete in two squads has one set of sessions rather than one per
    // squad — but discovery still starts from the team, which keeps the
    // athletes collection from ever needing to be enumerable.
    const athletesCol = collection(db, "teams", teamCode, "roster");
    onSnapshot(athletesCol, snapshot => {
      snapshot.docChanges().forEach(change => {
        const id = change.doc.id;
        if (change.type === "removed") {
          const idx = athletes.findIndex(x => x.id === id);
          if (idx !== -1) athletes.splice(idx, 1);
          const unsub = sessionUnsubByAthlete.get(id);
          if (unsub) { unsub(); sessionUnsubByAthlete.delete(id); }
          const unsubHrv = hrvUnsubByAthlete.get(id);
          if (unsubHrv) { unsubHrv(); hrvUnsubByAthlete.delete(id); }
          const unsubCfg = hrvConfigUnsubByAthlete.get(id);
          if (unsubCfg) { unsubCfg(); hrvConfigUnsubByAthlete.delete(id); }
          return;
        }
        const a = ensureAthlete(id);
        const data = change.doc.data();
        a.name = data.name || a.name;
        a.gender = data.gender || a.gender;

        if (!sessionUnsubByAthlete.has(id)) {
          const sessionsCol = collection(db, "athletes", id, "sessions");
          const unsub = onSnapshot(sessionsCol, sessSnap => {
            a.sessions = sessSnap.docs.map(d => {
              const s = d.data();
              const dateObj = s.date && s.date.toDate ? s.date.toDate() : new Date(s.date);
              return {
                // The document id, because a date does not identify a session:
                // four of them in one day is an ordinary test morning.
                id: d.id,
                date: isoDate(dateObj),
                // The full instant, kept alongside the day so several sessions
                // in one day can be ordered and told apart.
                startedAt: dateObj.getTime(),
                startedAtLabel: dateObj.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" }),
                duration: Math.round((s.durationSeconds || 0) / 60),
                hr: [s.hrZone1Seconds || 0, s.hrZone2Seconds || 0, s.hrZone3Seconds || 0],
                mech: [s.mechZone1Seconds || 0, s.mechZone2Seconds || 0, s.mechZone3Seconds || 0],
                aboveAnchor: s.secondsAboveAnchor || 0,
                rpe: (s.perceivedExertion === undefined || s.perceivedExertion === null) ? null : s.perceivedExertion,
                // A session pushed without a boat was shown as K1 on the phone:
                // until build 17 the app stored its default only once the
                // athlete changed it. Read the same way here, or the session
                // counts towards no record and no comparison. PPG has no boat.
                boatType: s.boatType || (s.isConditioning ? null : "K1"),
                isTest: !!s.isTest,
                isConditioning: !!s.isConditioning,
                strokeSignal: Array.isArray(s.bestNineSecondsSignal) ? s.bestNineSecondsSignal : null,
                strokeRateHz: s.bestNineSecondsRateHz || 0,
                name: (s.name || "").trim(),
                mechanicalPeaks: s.mechanicalPeaks || {}
              };
            });
            deriveAthlete(a);
            onDataChanged();
          }, err => listenerFailed("sessions", err));
          sessionUnsubByAthlete.set(id, unsub);
        }

        // Morning tests. A separate collection and a separate listener: they
        // arrive on their own rhythm — one a day, at dawn — and a session
        // syncing in the evening should not wait on them or vice versa.
        // Thresholds the coach set for this athlete, in a document the phone
        // never writes — so there is one owner and no write conflict.
        if (!hrvConfigUnsubByAthlete.has(id)) {
          const cfgDoc = doc(db, "athletes", id, "config", "hrvThresholds");
          // The error callback is not optional here. Without it a denied read
          // fails silently, the editor falls back to the defaults, and nothing
          // looks wrong — which is exactly how a rule that never covered the
          // config subcollection went unnoticed until somebody pressed Save.
          const unsubCfg = onSnapshot(cfgDoc, snap => {
            a.hrvThresholds = snap.exists() ? snap.data() : null;
            deriveAthlete(a);
            onDataChanged();
          }, err => {
            a.hrvThresholdsError = err.message;
            // A failure hidden inside a closed drawer is the same silence this
            // whole class of bug lived in, so it goes to the sync line too.
            listenerFailed(t("Seuils de fatigue"), err);
            onDataChanged();
          });
          hrvConfigUnsubByAthlete.set(id, unsubCfg);
        }

        // The coach's remarks, in a document only the coach writes — same
        // ownership as the thresholds, so there is never a write to reconcile
        // with the phone, which only reads.
        if (!hrvNotesUnsubByAthlete.has(id)) {
          const notesDoc = doc(db, "athletes", id, "config", "coachNotes");
          const unsubNotes = onSnapshot(notesDoc, snap => {
            a.coachNotes = snap.exists() ? snap.data() : {};
            onDataChanged();
          }, err => listenerFailed(t("Remarques"), err));
          hrvNotesUnsubByAthlete.set(id, unsubNotes);
        }

        if (!hrvUnsubByAthlete.has(id)) {
          const hrvCol = collection(db, "athletes", id, "hrv");
          const unsubHrv = onSnapshot(hrvCol, hrvSnap => {
            const mapped = hrvSnap.docs.map(d => {
              const t = d.data();
              const when = t.date && t.date.toDate ? t.date.toDate() : new Date(t.date);
              return {
                // The document id: a note the coach writes is filed against
                // the test it is about, and a date is not an identity — four
                // tests in one day is an ordinary morning of trials.
                id: d.id,
                date: isoDate(when),
                // LF and HF individually, not only their ratio: every one of
                // Schmitt's five rules is expressed on LF and HF apart, and a
                // ratio cannot be taken back apart. They were missing here
                // while the app was sending them, so the cascade compared
                // undefined against undefined and could never fire — the whole
                // fatigue reading was dead on this side and said nothing.
                // A position that could not be analysed is absent from the
                // document — the app omits its fields rather than writing
                // zeros (see HRVTestSyncPayload). The `> 0` is not
                // belt-and-braces: a mean heart rate of zero is not a reading
                // any body produces, so it catches the same thing whichever
                // way absence was encoded, including documents written by an
                // app version that predates the distinction.
                //
                // It matters because zero is not neutral here. Read as a
                // measurement it becomes −100 % against any reference, which
                // trips the peripheral-regulation rule every time: a truncated
                // morning was being reported to the coach as the most alarming
                // pattern in the cascade.
                complete: t.supineMeanHR > 0 && t.standingMeanHR > 0,
                supine: { hr: t.supineMeanHR || 0, rmssd: t.supineRMSSD || 0,
                          tp: t.supineTotalPower || 0, lfhf: t.supineLFOverHF || 0,
                          lf: t.supineLF || 0, hf: t.supineHF || 0 },
                standing: { hr: t.standingMeanHR || 0, rmssd: t.standingRMSSD || 0,
                            tp: t.standingTotalPower || 0, lfhf: t.standingLFOverHF || 0,
                            lf: t.standingLF || 0, hf: t.standingHF || 0 },
                // The five answers are never sent — only this. See
                // HRVTestSyncPayload on the app side.
                wellness: (t.wellnessScore === undefined || t.wellnessScore === null) ? null : t.wellnessScore,
                reliable: t.isReliable !== false,
                // The beats themselves, when the phone that sent this test was
                // new enough to include them. Null — not an empty array — for
                // everything synced before, so the card can say "no curve for
                // this one" rather than draw a flat line through nothing.
                supineRR: Array.isArray(t.supineRR) ? t.supineRR : null,
                standingRR: Array.isArray(t.standingRR) ? t.standingRR : null
              };
            }).sort((x, y) => x.date.localeCompare(y.date));

            // A test whose stream failed halfway carries one position or
            // neither. It is kept apart rather than mixed in: every panel here
            // reads `a.hrv` for medians, deltas and the cascade, and a missing
            // position read as zero would quietly move all of them. It still
            // has to be *visible* — a morning that failed is not a morning
            // without a test, and the difference is the coach's to see.
            a.hrv = mapped.filter(x => x.complete);
            a.hrvPartial = mapped.filter(x => !x.complete);
            deriveAthlete(a);
            onDataChanged();
          }, err => listenerFailed("HRV", err));
          hrvUnsubByAthlete.set(id, unsubHrv);
        }

        if (sessionUnsubByAthlete.has(id)) {
          deriveAthlete(a);
        }
      });
      onDataChanged();
      lastSyncEl.textContent = t("Connecté en direct");
    }, err => {
      lastSyncEl.textContent = t("Erreur de synchro : ") + err.message;
    });
  }

  // --- Coach account -------------------------------------------------------
  // The webapp has always signed in anonymously, which works because the rules
  // only ask for *someone* to be signed in and no path contains a uid. A named
  // account changes nothing about the data today; it is what the team model
  // will hang roles off, and it is what lets a coach be recognised on a second
  // machine. So it is offered, not required: an un-signed-in coach still sees
  // the team exactly as before.
  const AUTH_MESSAGES = {
    "auth/email-already-in-use": "Cette adresse a déjà un compte. Utilisez « Se connecter ».",
    "auth/invalid-email": "Cette adresse e-mail n'est pas valide.",
    "auth/weak-password": "Le mot de passe doit faire au moins 6 caractères.",
    "auth/missing-password": "Le mot de passe doit faire au moins 6 caractères.",
    // The SDK collapses a wrong address and a wrong password into one code on
    // purpose — telling them apart would say which addresses are registered.
    "auth/invalid-credential": "Adresse e-mail ou mot de passe incorrect.",
    "auth/user-not-found": "Adresse e-mail ou mot de passe incorrect.",
    "auth/wrong-password": "Adresse e-mail ou mot de passe incorrect.",
    "auth/user-disabled": "Ce compte a été désactivé.",
    "auth/too-many-requests": "Trop de tentatives. Réessayez dans quelques minutes.",
    "auth/operation-not-allowed": "La connexion par e-mail n'est pas activée sur le projet Firebase.",
    "auth/popup-blocked": "Le navigateur a bloqué la fenêtre Google. Autorisez les pop-ups pour ce site, puis réessayez.",
    // Fires when the same address already has a password account and the
    // project is set to keep one account per e-mail address.
    "auth/account-exists-with-different-credential":
      "Cette adresse a déjà un compte avec un mot de passe. Connectez-vous avec le mot de passe.",
    // The deployed domain has to be listed in Firebase > Authentication >
    // Settings > Authorized domains; localhost is allowed out of the box, so
    // this one only ever shows up in production.
    "auth/unauthorized-domain": "Ce domaine n'est pas autorisé pour la connexion Google sur le projet Firebase.",
  };

  // Inlined rather than fetched: Google's own mark, drawn at 17px next to the
  // label. A remote image would be one more thing to load before a dialog.
  const GOOGLE_MARK =
    '<svg viewBox="0 0 48 48" aria-hidden="true">' +
    '<path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.7l7.8 6.1C12.3 13.9 17.7 9.5 24 9.5z"/>' +
    '<path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.5 5.8c4.4-4 7-10 7-17.5z"/>' +
    '<path fill="#FBBC05" d="M10.4 28.2c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 15.9 0 19.8 0 23.5s1 7.6 2.6 10.8l7.8-6.1z"/>' +
    '<path fill="#34A853" d="M24 47c6.2 0 11.5-2 15.3-5.6l-7.5-5.8c-2.1 1.4-4.8 2.2-7.8 2.2-6.3 0-11.7-4.4-13.6-10.3l-7.8 6.1C6.5 41.6 14.6 47 24 47z"/>' +
    "</svg>";
  function authMessage(err) {
    const known = AUTH_MESSAGES[err && err.code];
    return known ? t(known) : (err && err.message) || String(err);
  }

  /// One-off carry-over of the coach's fatigue thresholds from the
  /// pre-migration path.
  ///
  /// Without it they fall back to the defaults without saying so, and the
  /// morning verdicts quietly change meaning — the same silence that hid the
  /// missing rules. Runs once per athlete and does nothing thereafter.
  /// Delete together with the legacy rules in phase C.

  let authInstance = null;
  let accountMode = "signIn";

  function renderAccountButton(user) {
    const btn = document.getElementById("accountBtn");
    if (!btn) return;
    const named = user && !user.isAnonymous && user.email;
    btn.textContent = named ? user.email : t("Se connecter");
    btn.title = named ? t("Gérer le compte") : t("Se connecter ou créer un compte");
  }

  function renderAccountDialog() {
    const user = authInstance && authInstance.currentUser;
    const body = document.getElementById("accountBody");
    if (user && !user.isAnonymous) {
      body.innerHTML =
        "<p>" + t("Connecté en tant que") + " <strong>" + esc(user.email || "") + "</strong></p>" +
        "<p>" + t("Se déconnecter ne retire rien à l'équipe : les données et votre place restent.") + "</p>" +
        '<div id="accountRow">' +
          '<button class="nav-btn" id="accountSignOut" style="width:auto; padding:0.4rem 1rem;">' + esc(t("Se déconnecter")) + "</button>" +
          '<button class="nav-btn" id="accountClose" style="width:auto; padding:0.4rem 1rem;">' + esc(t("Fermer")) + "</button>" +
        "</div>";
      document.getElementById("accountSignOut").addEventListener("click", async () => {
        await signOut(authInstance);
        // Reloading rather than re-wiring: every Firestore listener on the page
        // was opened with the old token, and a fresh load is both simpler and
        // easier to reason about than swapping credentials underneath them.
        location.reload();
      });
    } else {
      const creating = accountMode === "create";
      body.innerHTML =
        '<div class="seg" id="accountSeg" style="margin-bottom:.5rem;">' +
          '<button data-mode="signIn"' + (creating ? "" : ' class="active"') + ">" + esc(t("Se connecter")) + "</button>" +
          '<button data-mode="create"' + (creating ? ' class="active"' : "") + ">" + esc(t("Créer un compte")) + "</button>" +
        "</div>" +
        "<p>" + t("Le tableau de bord montre les équipes où votre compte a une place. Connectez-vous avec le compte qui a reçu l'invitation, ou ouvrez le lien d'invitation.") + "</p>" +
        // Google first: on the machine a coach actually uses, it is one click
        // and no password to remember. The e-mail form stays for everyone else.
        '<button id="accountGoogle">' + GOOGLE_MARK + "<span>" + esc(t("Continuer avec Google")) + "</span></button>" +
        '<div class="account-or">' + esc(t("ou")) + "</div>" +
        '<label for="accountEmail">' + esc(t("Adresse e-mail")) + "</label>" +
        '<input id="accountEmail" type="email" autocomplete="username" spellcheck="false">' +
        '<label for="accountPassword">' + esc(t("Mot de passe")) + "</label>" +
        '<input id="accountPassword" type="password" autocomplete="' + (creating ? "new-password" : "current-password") + '">' +
        (creating ? "" : '<p style="margin:.45rem 0 0"><button class="link-btn" id="accountReset" type="button">' +
          esc(t("Mot de passe oublié ?")) + "</button></p>") +
        '<p id="accountError" hidden></p>' +
        '<p id="accountInfo" class="chart-note" hidden></p>' +
        '<div id="accountRow">' +
          '<button class="nav-btn" id="accountSubmit" style="width:auto; padding:0.4rem 1rem;">' +
            esc(creating ? t("Créer le compte") : t("Se connecter")) + "</button>" +
          '<button class="nav-btn" id="accountClose" style="width:auto; padding:0.4rem 1rem;">' + esc(t("Fermer")) + "</button>" +
        "</div>";

      document.querySelectorAll("#accountSeg button").forEach(b => {
        b.addEventListener("click", () => { accountMode = b.dataset.mode; renderAccountDialog(); });
      });
      const submit = document.getElementById("accountSubmit");
      const errorEl = document.getElementById("accountError");
      async function attempt() {
        const email = document.getElementById("accountEmail").value.trim().toLowerCase();
        const password = document.getElementById("accountPassword").value;
        if (!email || password.length < 6) {
          errorEl.textContent = t("Le mot de passe doit faire au moins 6 caractères.");
          errorEl.hidden = false;
          return;
        }
        submit.disabled = true;
        errorEl.hidden = true;
        try {
          if (accountMode === "create") {
            await createUserWithEmailAndPassword(authInstance, email, password);
          } else {
            await signInWithEmailAndPassword(authInstance, email, password);
          }
          location.reload();
        } catch (err) {
          errorEl.textContent = authMessage(err);
          errorEl.hidden = false;
          submit.disabled = false;
        }
      }
      submit.addEventListener("click", attempt);
      document.getElementById("accountPassword")
        .addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });

      // Firebase e-mails the link and hosts the page where the new password
      // is chosen: no server of ours involved.
      const reset = document.getElementById("accountReset");
      if (reset) reset.addEventListener("click", async () => {
        const email = document.getElementById("accountEmail").value.trim().toLowerCase();
        const infoEl = document.getElementById("accountInfo");
        const sent = t("Si un compte existe pour cette adresse, un e-mail vient d'y être envoyé pour choisir un nouveau mot de passe. Pensez à regarder dans les indésirables.");
        errorEl.hidden = true;
        infoEl.hidden = true;
        if (!email) {
          errorEl.textContent = t("Saisissez d'abord l'adresse du compte.");
          errorEl.hidden = false;
          return;
        }
        reset.disabled = true;
        try {
          authInstance.languageCode = LANG;
          await sendPasswordResetEmail(authInstance, email);
          infoEl.textContent = sent;
          infoEl.hidden = false;
        } catch (err) {
          // An unknown address must read like a known one: anything else tells
          // whoever types it which addresses have an account.
          if (err && err.code === "auth/user-not-found") {
            infoEl.textContent = sent;
            infoEl.hidden = false;
          } else {
            errorEl.textContent = authMessage(err);
            errorEl.hidden = false;
          }
        }
        reset.disabled = false;
      });

      document.getElementById("accountGoogle").addEventListener("click", async () => {
        errorEl.hidden = true;
        try {
          await signInWithPopup(authInstance, new GoogleAuthProvider());
          location.reload();
        } catch (err) {
          // Closing the popup, or opening a second one, is a decision rather
          // than a failure — saying "error" there would be a lie.
          if (err && (err.code === "auth/popup-closed-by-user"
                   || err.code === "auth/cancelled-popup-request")) return;
          errorEl.textContent = authMessage(err);
          errorEl.hidden = false;
        }
      });
    }
    if (accountNotice) {
      body.insertAdjacentHTML("afterbegin", '<p class="invite-warn">' + esc(accountNotice) + "</p>");
    }
    document.getElementById("accountClose").addEventListener("click", hideAccount);
  }

  /// Why the dialog opened, when something other than the account button
  /// opened it — the invite button, for an account without a coaching seat.
  let accountNotice = null;

  function showAccount(notice) {
    accountMode = "signIn";
    accountNotice = notice || null;
    renderAccountDialog();
    document.getElementById("accountOverlay").hidden = false;
  }
  function hideAccount() { document.getElementById("accountOverlay").hidden = true; }

  document.getElementById("accountBtn").addEventListener("click", () => showAccount());
  document.getElementById("accountOverlay").addEventListener("click", (e) => {
    if (e.target.id === "accountOverlay") hideAccount();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideAccount(); });

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  authInstance = auth;
  firestore = getFirestore(app);
  const db = firestore;
  if (USE_EMULATOR) {
    connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
    connectFirestoreEmulator(db, "127.0.0.1", 8080);
  }
  lastSyncEl.textContent = t("Connexion…");

  let started = false;
  onAuthStateChanged(auth, async user => {
    signedInUser = user;
    renderAccountButton(user);
    // Opened once: the listeners are keyed by team, not by identity, so a
    // sign-in on top of an anonymous session does not need them restarted.
    if (started) return;

    if (joinRequest) {
      // No anonymous session for someone arriving to join: the seat needs a
      // real account, and signing in reloads the page onto this same link.
      if (user && !user.isAnonymous) started = true;
      showJoin(db, user);
      return;
    }
    if (!user || user.isAnonymous) {
      // Since phase 03 a session without a seat reads nothing, so there is no
      // anonymous fallback any more: an empty page would only look broken.
      lastSyncEl.textContent = t("Connectez-vous pour voir vos équipes.");
      showAccount();
      return;
    }

    started = true;
    const seats = await mySeats(db, user);
    const coached = seats.filter(canInvite);
    currentSeat = coached.find(s => s.teamId === teamCode) || null;
    if (!currentSeat) {
      // No team remembered, or one this account does not coach — another
      // account's, or a team it has left: open the first it does coach.
      if (coached.length) { openTeam(coached[0].teamId); return; }
      lastSyncEl.textContent = seats.length
        ? t("Ce compte a seulement une place d'athlète : le tableau de bord est réservé aux entraîneurs et aux propriétaires.")
        : t("Aucune équipe ouverte : connectez-vous avec le compte qui a reçu une invitation.");
      return;
    }
    renderTeamPicker(db, seats);
    startListening(db);
  });

  function fmtMinSec(sec) {
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m + ":" + String(s).padStart(2, "0");
  }
  function relDate(iso) {
    const d = new Date(iso + "T12:00:00");
    const days = Math.round((new Date() - d) / 86400000);
    if (days <= 0) return t("aujourd'hui");
    if (days === 1) return t("hier");
    return t("il y a %d j").replace("%d", days);
  }
  function shortDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return d.getDate() + " " + MONTH_NAMES[d.getMonth()].slice(0, 3);
  }
  function rpeLabel(rpe) {
    return rpe == null ? "—" : rpe + "/10";
  }
  function stackBar(values, colors) {
    const total = values.reduce((a,b) => a+b, 0) || 1;
    return values.map((v,i) => `<span style="width:${(v/total*100).toFixed(1)}%;background:${colors[i]}"></span>`).join("");
  }
  function sparkline(history, w, h) {
    const vals = history.map(p => p.v);
    const denom = vals.length > 1 ? vals.length - 1 : 1;
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = (max - min) || 1;
    const pts = vals.map((v,i) => {
      const x = (i/denom) * (w-8) + 4;
      const y = h - 4 - ((v-min)/span) * (h-8);
      return [x,y];
    });
    const path = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const last = pts[pts.length-1];
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Tendance récente")}">
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="var(--accent)"/>
    </svg>`;
  }
  function trendDelta(history) {
    const first = history[0].v, last = history[history.length-1].v;
    const pct = first ? ((last-first)/first*100) : 0;
    const dir = pct > 8 ? "up" : pct < -8 ? "down" : "flat";
    const arrow = dir === "up" ? "↑" : dir === "down" ? "↓" : "→";
    return { dir, label: `${arrow} ${Math.abs(pct).toFixed(0)}%` };
  }

  /// Athlete and session names are free text typed on a phone, and every
  /// render path here builds HTML by string interpolation — an apostrophe in
  /// "Fractionné 8x2'" or a stray angle bracket would otherwise mangle the
  /// markup.
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function cardHTML(a) {
    const trend = trendDelta(a.history);
    const badge = a.status === "watch" ? `<span class="badge">${t("À surveiller")}</span>` : "";
    return `
      <article class="card" tabindex="0" data-id="${a.id}" role="button" aria-label="${t("Voir le détail de")} ${esc(a.name)}">
        <div class="card-head">
          <div>
            <p class="athlete-name">${esc(a.name)}</p>
            <p class="athlete-meta">${t("Dernière séance")}${t(" : ")}${a.lastSessionName ? esc(a.lastSessionName) + " · " : ""}${relDate(a.lastSession)} · ${a.duration} min · RPE ${rpeLabel(a.rpe)}${a.lastSessionIsTest ? t(" · Test") : ""}${a.lastSessionIsConditioning ? t(" · PPG") : ""}</p>
          </div>
          ${badge}
        </div>
